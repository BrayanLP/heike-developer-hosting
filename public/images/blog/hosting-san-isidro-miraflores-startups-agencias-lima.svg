<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="bgSanIsidro" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#18181b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="1" />
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="#09090b" />
  <rect width="1200" height="675" fill="url(#bgSanIsidro)" />

  <!-- Background Financial District Grid Lines -->
  <g stroke="#3f3f46" stroke-width="1" opacity="0.3">
    <line x1="800" y1="50" x2="800" y2="600" />
    <line x1="900" y1="50" x2="900" y2="600" />
    <line x1="1000" y1="50" x2="1000" y2="600" />
    <line x1="1100" y1="50" x2="1100" y2="600" />
  </g>

  <!-- Header -->
  <g transform="translate(80, 70)">
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#ff9900" fill-opacity="0.2" stroke="#ff9900" stroke-width="1" />
    <text x="110" y="21" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">LIMA CORPORATIVA &amp; TECH</text>
    <text x="0" y="70" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="900">HOSTING SAN ISIDRO &amp; MIRAFLORES</text>
    <text x="0" y="98" fill="#94a3b8" font-family="sans-serif" font-size="15">Infraestructura de Grado Empresarial para Startups, Fintechs y Agencias de Software</text>
  </g>

  <!-- Left: Developer Stacks &amp; API Latency -->
  <g transform="translate(80, 200)">
    <rect x="0" y="0" width="580" height="400" rx="20" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
    
    <g transform="translate(30, 30)">
      <!-- Developer Stack Selector Box -->
      <rect x="0" y="0" width="520" height="110" rx="14" fill="#09090b" stroke="#ff9900" stroke-width="1.5" />
      <circle cx="50" cy="55" r="25" fill="#ff9900" fill-opacity="0.2" />
      <text x="50" y="62" fill="#fbbf24" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">⚡</text>

      <text x="90" y="42" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Selectores Nativos Node.js, Python &amp; PHP 8.x</text>
      <text x="90" y="66" fill="#a1a1aa" font-family="sans-serif" font-size="13">FastAPI, Next.js, Laravel, Express y automatización de despliegue Git</text>
      <text x="90" y="90" fill="#fbbf24" font-family="monospace" font-size="11">Terminal SSH • Composer • npm/pnpm • Cron Jobs Avanzados</text>
    </g>

    <!-- Performance &amp; Security Features -->
    <g transform="translate(30, 160)">
      <rect x="0" y="0" width="250" height="120" rx="14" fill="#09090b" stroke="#06b6d4" stroke-width="1.5" />
      <text x="20" y="32" fill="#67e8f9" font-family="sans-serif" font-size="13" font-weight="bold">FINTECHS &amp; APIS CRÍTICAS</text>
      <text x="20" y="60" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Latencia &lt; 15ms</text>
      <text x="20" y="82" fill="#a1a1aa" font-family="sans-serif" font-size="11">Conexión con pasarelas y SUNAT</text>
      <text x="20" y="102" fill="#67e8f9" font-family="monospace" font-size="11">SSL TLS 1.3 / HTTP/3</text>

      <rect x="270" y="0" width="250" height="120" rx="14" fill="#09090b" stroke="#22c55e" stroke-width="1.5" />
      <text x="290" y="32" fill="#4ade80" font-family="sans-serif" font-size="13" font-weight="bold">AGENCIAS MULTIDOMINIO</text>
      <text x="290" y="60" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Paneles Independientes</text>
      <text x="290" y="82" fill="#a1a1aa" font-family="sans-serif" font-size="11">cPanel / DirectAdmin / Webuzo</text>
      <text x="290" y="102" fill="#4ade80" font-family="monospace" font-size="11">CloudLinux Aislado</text>
    </g>

    <!-- Top Corporate Districts -->
    <g transform="translate(30, 310)">
      <rect x="0" y="0" width="115" height="36" rx="8" fill="#ff9900" fill-opacity="0.15" stroke="#ff9900" stroke-width="1" />
      <text x="57" y="22" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SAN ISIDRO</text>

      <rect x="125" y="0" width="115" height="36" rx="8" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1" />
      <text x="182" y="22" fill="#67e8f9" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">MIRAFLORES</text>

      <rect x="250" y="0" width="115" height="36" rx="8" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1" />
      <text x="307" y="22" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SURCO / BORJA</text>

      <rect x="375" y="0" width="115" height="36" rx="8" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1" />
      <text x="432" y="22" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">BARRANCO</text>
    </g>
  </g>

  <!-- Right: Glass Skyscraper &amp; Cloud Infrastructure Graphic -->
  <g transform="translate(700, 200)">
    <rect x="0" y="0" width="420" height="400" rx="20" fill="#18181b" stroke="#ff9900" stroke-width="2" />
    
    <!-- Skyscraper Silhouettes -->
    <g transform="translate(50, 40)">
      <rect x="40" y="50" width="60" height="200" rx="4" fill="#27272a" stroke="#52525b" stroke-width="1" />
      <rect x="120" y="10" width="80" height="240" rx="4" fill="#09090b" stroke="#ff9900" stroke-width="2" />
      <rect x="220" y="70" width="60" height="180" rx="4" fill="#27272a" stroke="#52525b" stroke-width="1" />

      <!-- Windows in center tower -->
      <g fill="#ff9900" opacity="0.6">
        <rect x="135" y="30" width="12" height="12" rx="2" />
        <rect x="155" y="30" width="12" height="12" rx="2" />
        <rect x="175" y="30" width="12" height="12" rx="2" />
        <rect x="135" y="60" width="12" height="12" rx="2" />
        <rect x="155" y="60" width="12" height="12" rx="2" />
        <rect x="175" y="60" width="12" height="12" rx="2" />
      </g>

      <rect x="20" y="270" width="280" height="50" rx="10" fill="#09090b" stroke="#22c55e" stroke-width="1.5" />
      <text x="160" y="301" fill="#4ade80" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">FACTURA SUNAT CON RUC 20 / 10</text>
    </g>
  </g>
</svg>
