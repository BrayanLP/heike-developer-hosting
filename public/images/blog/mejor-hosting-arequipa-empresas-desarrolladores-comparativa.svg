<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="bgArequipa" cx="70%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#18181b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="volcanoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#09090b" />
  <rect width="1200" height="675" fill="url(#bgArequipa)" />

  <!-- Header -->
  <g transform="translate(80, 70)">
    <rect x="0" y="0" width="180" height="32" rx="16" fill="#ff9900" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1" />
    <text x="90" y="21" fill="#fcd34d" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">CIUDAD BLANCA</text>
    <text x="0" y="70" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="900">EL MEJOR HOSTING EN AREQUIPA</text>
    <text x="0" y="98" fill="#94a3b8" font-family="sans-serif" font-size="15">Comparativa 2026: Discos NVMe 6x Más Rápidos, LiteSpeed y Soporte Local en Soles</text>
  </g>

  <!-- Left: Comparison &amp; Developer Stacks Card -->
  <g transform="translate(80, 200)">
    <rect x="0" y="0" width="580" height="400" rx="20" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
    
    <g transform="translate(30, 30)">
      <!-- Arequipa Speed Winner Box -->
      <rect x="0" y="0" width="520" height="110" rx="14" fill="#09090b" stroke="#ff9900" stroke-width="1.5" />
      <circle cx="50" cy="55" r="25" fill="#ff9900" fill-opacity="0.2" />
      <text x="50" y="62" fill="#fbbf24" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">🏆</text>

      <text x="90" y="42" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">La Opción #1 para Empresas y Desarrolladores en el Sur</text>
      <text x="90" y="66" fill="#a1a1aa" font-family="sans-serif" font-size="13">Rendimiento garantizado para E-Commerce, Portales Turísticos y SUNAT</text>
      <text x="90" y="90" fill="#fbbf24" font-family="monospace" font-size="11">Precios fijos desde S/ 60 al año • Sin cobros sorpresivos en USD</text>
    </g>

    <!-- Stack Highlights -->
    <g transform="translate(30, 160)">
      <rect x="0" y="0" width="250" height="120" rx="14" fill="#09090b" stroke="#22c55e" stroke-width="1.5" />
      <text x="20" y="32" fill="#4ade80" font-family="sans-serif" font-size="13" font-weight="bold">DESARROLLO MULTI-STACK</text>
      <text x="20" y="60" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">NodeJS, Python, PHP 8</text>
      <text x="20" y="82" fill="#a1a1aa" font-family="sans-serif" font-size="11">Next.js, FastAPI, Laravel</text>
      <text x="20" y="102" fill="#4ade80" font-family="monospace" font-size="11">Terminal SSH + Git Deploy</text>

      <rect x="270" y="0" width="250" height="120" rx="14" fill="#09090b" stroke="#06b6d4" stroke-width="1.5" />
      <text x="290" y="32" fill="#67e8f9" font-family="sans-serif" font-size="13" font-weight="bold">ATENCIÓN EN AREQUIPA</text>
      <text x="290" y="60" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">WhatsApp Inmediato</text>
      <text x="290" y="82" fill="#a1a1aa" font-family="sans-serif" font-size="11">Yape, Plin y BCP Directo</text>
      <text x="290" y="102" fill="#67e8f9" font-family="monospace" font-size="11">+51 975 521 788</text>
    </g>

    <!-- Location Badges -->
    <g transform="translate(30, 310)">
      <rect x="0" y="0" width="115" height="36" rx="8" fill="#ff9900" fill-opacity="0.15" stroke="#ff9900" stroke-width="1" />
      <text x="57" y="22" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">AREQUIPA</text>

      <rect x="125" y="0" width="115" height="36" rx="8" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1" />
      <text x="182" y="22" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">CERRO COLORADO</text>

      <rect x="250" y="0" width="115" height="36" rx="8" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1" />
      <text x="307" y="22" fill="#67e8f9" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">YANAHUARA</text>

      <rect x="375" y="0" width="115" height="36" rx="8" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1" />
      <text x="432" y="22" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">BUSTAMANTE</text>
    </g>
  </g>

  <!-- Right: Misti Volcano &amp; High-Tech Power Grid Graphic -->
  <g transform="translate(700, 200)">
    <rect x="0" y="0" width="420" height="400" rx="20" fill="#18181b" stroke="#ff9900" stroke-width="2" />
    
    <!-- Stylized Misti Volcano Silhouette with Snow Top and Glowing Core -->
    <g transform="translate(50, 40)">
      <polygon points="160,30 280,220 40,220" fill="url(#volcanoGrad)" />
      <!-- Snow Cap -->
      <polygon points="160,30 190,80 170,75 160,85 150,75 130,80" fill="#ffffff" />

      <!-- Energy Line Pulse from Summit -->
      <line x1="160" y1="30" x2="160" y2="0" stroke="#ff9900" stroke-width="3" stroke-dasharray="4,3" />

      <rect x="10" y="250" width="300" height="50" rx="10" fill="#09090b" stroke="#22c55e" stroke-width="1.5" />
      <text x="160" y="281" fill="#4ade80" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">MIGRACIÓN GRATIS SIN CAÍDAS</text>

      <rect x="10" y="310" width="300" height="40" rx="10" fill="#ff9900" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1" />
      <text x="160" y="335" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">PLANES DESDE S/ 60 AL AÑO</text>
    </g>
  </g>
</svg>
