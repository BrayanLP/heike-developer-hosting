<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="bgNvme" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#18181b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="#09090b" />
  <rect width="1200" height="675" fill="url(#bgNvme)" />

  <!-- Data Bus Circuit Lines -->
  <g stroke="#f59e0b" stroke-width="1.5" opacity="0.15">
    <path d="M 100 150 L 300 150 L 450 300 L 750 300 L 900 150 L 1100 150" fill="none" />
    <path d="M 100 550 L 350 550 L 450 450 L 750 450 L 850 550 L 1100 550" fill="none" />
    <circle cx="450" cy="300" r="4" fill="#fbbf24" />
    <circle cx="750" cy="300" r="4" fill="#fbbf24" />
    <circle cx="450" cy="450" r="4" fill="#fbbf24" />
    <circle cx="750" cy="450" r="4" fill="#fbbf24" />
  </g>

  <!-- Header Badge & Title -->
  <g transform="translate(80, 55)">
    <rect x="0" y="0" width="280" height="32" rx="16" fill="#f59e0b" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1" />
    <text x="140" y="21" fill="#fcd34d" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">TECNOLOGÍA DE ALMACENAMIENTO WEB</text>
    <text x="0" y="70" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="900">¿QUÉ ES HOSTING NVMe PCIe 4.0?</text>
    <text x="0" y="98" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="15">Cómo la Arquitectura NVMe Acelera tu Sitio hasta 6x más que SSD SATA y Reduce el TTFB</text>
  </g>

  <!-- Visual Hardware Comparison Grid -->
  <g transform="translate(80, 185)">
    <!-- Card 1: SSD SATA III Tradicional -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="490" height="420" rx="20" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />
      <rect x="25" y="25" width="210" height="30" rx="8" fill="#27272a" />
      <text x="130" y="45" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">SSD SATA III TRADICIONAL</text>

      <g transform="translate(25, 80)" font-family="system-ui, sans-serif">
        <text x="0" y="20" fill="#71717a" font-size="12" font-weight="bold">VELOCIDAD MÁXIMA DE LECTURA</text>
        <text x="0" y="52" fill="#ef4444" font-size="28" font-weight="900">~550 MB/s</text>
        <rect x="0" y="65" width="440" height="8" rx="4" fill="#27272a" />
        <rect x="0" y="65" width="70" height="8" rx="4" fill="#ef4444" />

        <text x="0" y="115" fill="#71717a" font-size="12" font-weight="bold">COLAS DE COMANDOS CONCURRENTES</text>
        <text x="0" y="145" fill="#ffffff" font-size="22" font-weight="bold">1 Cola (32 comandos)</text>
        <text x="0" y="168" fill="#a1a1aa" font-size="12">Protocolo AHCI antiguo diseñado para discos magnéticos</text>

        <text x="0" y="215" fill="#71717a" font-size="12" font-weight="bold">OPERACIONES POR SEGUNDO (IOPS)</text>
        <text x="0" y="245" fill="#ffffff" font-size="22" font-weight="bold">Hasta 50,000 IOPS</text>
        <text x="0" y="268" fill="#a1a1aa" font-size="12">Cuello de botella con consultas MySQL simultáneas</text>

        <text x="0" y="315" fill="#71717a" font-size="12" font-weight="bold">TIEMPO DE RESPUESTA DEL SERVIDOR (TTFB)</text>
        <text x="0" y="340" fill="#ef4444" font-size="16" font-weight="bold">450 ms - 900 ms (Mayor latencia en carga)</text>
      </g>
    </g>

    <!-- Card 2: NVMe SSD PCIe 4.0 -->
    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="500" height="420" rx="20" fill="#18181b" stroke="#f59e0b" stroke-width="2" />
      <rect x="25" y="25" width="240" height="30" rx="8" fill="#f59e0b" fill-opacity="0.25" />
      <text x="145" y="45" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">NVMe SSD PCIe 4.0 (BRAYAN HOSTING)</text>

      <g transform="translate(25, 80)" font-family="system-ui, sans-serif">
        <text x="0" y="20" fill="#fcd34d" font-size="12" font-weight="bold">VELOCIDAD MÁXIMA DE LECTURA (6X MÁS RÁPIDO)</text>
        <text x="0" y="52" fill="#10b981" font-size="28" font-weight="900">> 3,500 MB/s</text>
        <rect x="0" y="65" width="450" height="8" rx="4" fill="#27272a" />
        <rect x="0" y="65" width="450" height="8" rx="4" fill="url(#speedGrad)" />

        <text x="0" y="115" fill="#fcd34d" font-size="12" font-weight="bold">COLAS DE COMANDOS CONCURRENTES</text>
        <text x="0" y="145" fill="#ffffff" font-size="22" font-weight="bold">64,000 Colas (64,000 comandos c/u)</text>
        <text x="0" y="168" fill="#34d399" font-size="12">Paralelismo masivo conectado directo al bus PCIe de la CPU</text>

        <text x="0" y="215" fill="#fcd34d" font-size="12" font-weight="bold">OPERACIONES POR SEGUNDO (IOPS)</text>
        <text x="0" y="245" fill="#ffffff" font-size="22" font-weight="bold">> 500,000 IOPS</text>
        <text x="0" y="268" fill="#34d399" font-size="12">Respuesta instantánea en queries complejas y carritos</text>

        <text x="0" y="315" fill="#fcd34d" font-size="12" font-weight="bold">TIEMPO DE RESPUESTA DEL SERVIDOR (TTFB)</text>
        <text x="0" y="340" fill="#10b981" font-size="16" font-weight="bold">&lt; 150 ms (Aprobado en Core Web Vitals)</text>
      </g>
    </g>
  </g>
</svg>
