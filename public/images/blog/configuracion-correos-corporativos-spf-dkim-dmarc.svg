<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="bgGlow10" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#18181b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="cardGrad10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#18181b" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#09090b" />
  <rect width="1200" height="675" fill="url(#bgGlow10)" />

  <rect x="250" y="100" width="700" height="475" rx="24" fill="url(#cardGrad10)" stroke="#3f3f46" stroke-width="2" />
  
  <rect x="250" y="100" width="700" height="50" rx="24" fill="#18181b" />
  <rect x="250" y="125" width="700" height="25" fill="#18181b" />
  <circle cx="285" cy="125" r="7" fill="#ef4444" />
  <circle cx="310" cy="125" r="7" fill="#eab308" />
  <circle cx="335" cy="125" r="7" fill="#22c55e" />
  <text x="600" y="130" fill="#a1a1aa" font-family="monospace" font-size="14" text-anchor="middle">Corporate Email Deliverability: SPF + DKIM + DMARC</text>

  <!-- Email Inbox &amp; DNS Record Mockup -->
  <g transform="translate(300, 180)">
    <!-- Email Deliverability Visual -->
    <rect x="0" y="0" width="600" height="60" rx="14" fill="#09090b" stroke="#22c55e" stroke-width="2" />
    <text x="25" y="36" fill="#22c55e" font-family="sans-serif" font-size="15" font-weight="bold">✉ Bandeja de Entrada Principal (Inbox 100%)</text>
    <text x="560" y="36" fill="#a1a1aa" font-family="monospace" font-size="12" text-anchor="end">0% Spam Score</text>

    <!-- DNS Records Terminal -->
    <rect x="0" y="80" width="600" height="160" rx="14" fill="#09090b" stroke="#27272a" stroke-width="1.5" />
    <text x="25" y="115" fill="#a78bfa" font-family="monospace" font-size="13">TXT @ "v=spf1 +a +mx include:_spf.brayan.pe ~all"</text>
    <text x="25" y="145" fill="#60a5fa" font-family="monospace" font-size="13">TXT default._domainkey "v=DKIM1; k=rsa; p=MIIBIjAN..."</text>
    <text x="25" y="175" fill="#34d399" font-family="monospace" font-size="13">TXT _dmarc "v=DMARC1; p=quarantine; rua=mailto:dmarc@..."</text>
    <text x="25" y="210" fill="#fbbf24" font-family="sans-serif" font-size="13">Validado con: Gmail, Outlook 365, Yahoo &amp; Apple Mail</text>
  </g>

  <!-- Badges -->
  <g transform="translate(300, 480)">
    <rect x="0" y="0" width="130" height="40" rx="10" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="65" y="25" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">SPF RECORD</text>

    <rect x="150" y="0" width="130" height="40" rx="10" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5" />
    <text x="215" y="25" fill="#60a5fa" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">DKIM KEY</text>

    <rect x="300" y="0" width="140" height="40" rx="10" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5" />
    <text x="370" y="25" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">DMARC POLICY</text>

    <rect x="460" y="0" width="140" height="40" rx="10" fill="#ff9900" fill-opacity="0.15" stroke="#ff9900" stroke-width="1.5" />
    <text x="530" y="25" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">ANTI-SPAM</text>
  </g>
</svg>
