<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#18181b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#18181b" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffaa00" />
      <stop offset="100%" stop-color="#ff6600" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="#09090b" />
  <rect width="1200" height="675" fill="url(#bgGlow)" />

  <!-- Grid lines -->
  <g stroke="#27272a" stroke-width="1" opacity="0.4">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="240" y1="0" x2="240" y2="675" />
    <line x1="480" y1="0" x2="480" y2="675" />
    <line x1="720" y1="0" x2="720" y2="675" />
    <line x1="960" y1="0" x2="960" y2="675" />
  </g>

  <!-- Central Server &amp; Code Mockup -->
  <rect x="250" y="100" width="700" height="475" rx="24" fill="url(#cardGrad)" stroke="#3f3f46" stroke-width="2" />
  
  <!-- Window Header -->
  <rect x="250" y="100" width="700" height="50" rx="24" fill="#18181b" />
  <rect x="250" y="125" width="700" height="25" fill="#18181b" />
  <circle cx="285" cy="125" r="7" fill="#ef4444" />
  <circle cx="310" cy="125" r="7" fill="#eab308" />
  <circle cx="335" cy="125" r="7" fill="#22c55e" />
  <text x="600" y="130" fill="#a1a1aa" font-family="monospace" font-size="14" text-anchor="middle">node server.js — cPanel Application Manager</text>

  <!-- Server Lights and Console -->
  <g transform="translate(300, 180)">
    <!-- Code lines -->
    <rect x="0" y="0" width="340" height="12" rx="4" fill="#ffaa00" opacity="0.8" />
    <rect x="0" y="24" width="480" height="12" rx="4" fill="#71717a" opacity="0.5" />
    <rect x="0" y="48" width="420" height="12" rx="4" fill="#71717a" opacity="0.5" />
    <rect x="0" y="72" width="280" height="12" rx="4" fill="#22c55e" opacity="0.8" />

    <!-- Terminal Status Box -->
    <rect x="0" y="110" width="600" height="140" rx="12" fill="#09090b" stroke="#27272a" stroke-width="1.5" />
    <text x="25" y="145" fill="#22c55e" font-family="monospace" font-size="16" font-weight="bold">● App Status: ONLINE (NodeJS v20 LTS)</text>
    <text x="25" y="175" fill="#a1a1aa" font-family="monospace" font-size="14">Port: 3000 | NVMe Storage: 10 GB | CloudLinux CageFS: Active</text>
    <text x="25" y="205" fill="#ffaa00" font-family="monospace" font-size="14">Ready for Next.js SSR &amp; Fast API Endpoints</text>
  </g>

  <!-- Badges -->
  <g transform="translate(300, 480)">
    <rect x="0" y="0" width="140" height="40" rx="10" fill="#ff9900" fill-opacity="0.15" stroke="#ff9900" stroke-width="1.5" />
    <text x="70" y="25" fill="#ffaa00" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">NODE.JS 20</text>

    <rect x="160" y="0" width="130" height="40" rx="10" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1.5" />
    <text x="225" y="25" fill="#4ade80" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">NEXT.JS 15</text>

    <rect x="310" y="0" width="130" height="40" rx="10" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5" />
    <text x="375" y="25" fill="#60a5fa" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">cPANEL</text>

    <rect x="460" y="0" width="140" height="40" rx="10" fill="#eab308" fill-opacity="0.15" stroke="#eab308" stroke-width="1.5" />
    <text x="530" y="25" fill="#fde047" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">NVMe SSD</text>
  </g>

  <!-- Floating Glow nodes -->
  <circle cx="180" cy="180" r="40" fill="#ff9900" opacity="0.15" filter="url(#glow)" />
  <circle cx="1020" cy="480" r="60" fill="#22c55e" opacity="0.12" filter="url(#glow)" />
</svg>
