  </defs>

  <rect width="1200" height="675" fill="#09090b" />
  <rect width="1200" height="675" fill="url(#bgIquitos)" />

  <!-- Amazon River curves & Digital Connection Grid -->
  <g stroke="#06b6d4" stroke-width="1.5" opacity="0.25">
