      <text x="290" y="30" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">TRANSPORTE FLUVIAL</text>
      <text x="290" y="58" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Logística Amazónica</text>
