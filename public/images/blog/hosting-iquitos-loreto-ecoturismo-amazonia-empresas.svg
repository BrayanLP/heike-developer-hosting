      <text x="15" y="24" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">SERVIDOR WEB</text>
      <text x="15" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">LiteSpeed Enterprise</text>
      <text x="355" y="35" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="end">3x más veloz</text>
