      <rect x="0" y="0" width="370" height="65" rx="10" fill="#09090b" stroke="#a855f7" stroke-width="1" />
      <text x="15" y="24" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">ATENCIÓN EN PERÚ</text>
      <text x="15" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">WhatsApp directo +51 975 521 788</text>
      <text x="355" y="35" fill="#22c55e" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="end">En Soles</text>
