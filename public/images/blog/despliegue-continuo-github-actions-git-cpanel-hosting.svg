<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="bgCicd" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#18181b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="gitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="#09090b" />
  <rect width="1200" height="675" fill="url(#bgCicd)" />

  <!-- Code / Terminal Grid -->
  <g stroke="#3b82f6" stroke-width="1" opacity="0.12">
    <line x1="100" y1="0" x2="100" y2="675" />
    <line x1="350" y1="0" x2="350" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="850" y1="0" x2="850" y2="675" />
    <line x1="1100" y1="0" x2="1100" y2="675" />
  </g>

  <!-- Header Badge & Title -->
  <g transform="translate(80, 55)">
    <rect x="0" y="0" width="280" height="32" rx="16" fill="#3b82f6" fill-opacity="0.2" stroke="#60a5fa" stroke-width="1" />
    <text x="140" y="21" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">DEVOPS &amp; AUTOMATIZACIÓN</text>
    <text x="0" y="70" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="900">DESPLIEGUE CONTINUO (CI/CD) EN cPANEL</text>
    <text x="0" y="98" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="15">Automatiza tu Flujo con Git, GitHub Actions, SSH y LiteSpeed en Servidores NVMe</text>
  </g>

  <!-- CI/CD Pipeline Steps Illustration -->
  <g transform="translate(80, 190)">
    <!-- Pipeline Flow Container -->
    <rect x="0" y="0" width="1040" height="415" rx="20" fill="#18181b" stroke="#27272a" stroke-width="2" />

    <!-- 4 Stages in Pipeline -->
    <g transform="translate(40, 50)" font-family="system-ui, sans-serif">
      <!-- Stage 1: Git Push -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="220" height="280" rx="16" fill="#09090b" stroke="#f43f5e" stroke-width="1.5" />
        <circle cx="35" cy="40" r="18" fill="#f43f5e" fill-opacity="0.2" />
        <text x="35" y="46" fill="#fb7185" font-size="14" font-weight="bold" text-anchor="middle">1</text>
        <text x="65" y="45" fill="#ffffff" font-size="16" font-weight="bold">Git Push</text>
        <rect x="20" y="80" width="180" height="1" fill="#27272a" />
        <text x="20" y="115" fill="#a1a1aa" font-size="13">Confirmar cambios:</text>
        <text x="20" y="145" fill="#f43f5e" font-family="monospace" font-size="12">git commit -m "feat"</text>
        <text x="20" y="170" fill="#f43f5e" font-family="monospace" font-size="12">git push origin main</text>
        <text x="20" y="215" fill="#71717a" font-size="12">Disparador automático del webhook en GitHub</text>
      </g>

      <!-- Arrow 1 -> 2 -->
      <g transform="translate(225, 130)">
        <line x1="0" y1="10" x2="20" y2="10" stroke="#f59e0b" stroke-width="2" />
        <polygon points="20,5 28,10 20,15" fill="#f59e0b" />
      </g>

      <!-- Stage 2: GitHub Actions Runner -->
      <g transform="translate(255, 0)">
        <rect x="0" y="0" width="220" height="280" rx="16" fill="#09090b" stroke="#3b82f6" stroke-width="1.5" />
        <circle cx="35" cy="40" r="18" fill="#3b82f6" fill-opacity="0.2" />
        <text x="35" y="46" fill="#60a5fa" font-size="14" font-weight="bold" text-anchor="middle">2</text>
        <text x="65" y="45" fill="#ffffff" font-size="16" font-weight="bold">GitHub Actions</text>
        <rect x="20" y="80" width="180" height="1" fill="#27272a" />
        <text x="20" y="115" fill="#a1a1aa" font-size="13">Runner en la nube:</text>
        <text x="20" y="145" fill="#60a5fa" font-family="monospace" font-size="12">npm run build</text>
        <text x="20" y="170" fill="#60a5fa" font-family="monospace" font-size="12">composer install</text>
        <text x="20" y="215" fill="#71717a" font-size="12">Validación de tests y empaquetado de assets</text>
      </g>

      <!-- Arrow 2 -> 3 -->
      <g transform="translate(480, 130)">
        <line x1="0" y1="10" x2="20" y2="10" stroke="#f59e0b" stroke-width="2" />
        <polygon points="20,5 28,10 20,15" fill="#f59e0b" />
      </g>

      <!-- Stage 3: SSH / Rsync Sync -->
      <g transform="translate(510, 0)">
        <rect x="0" y="0" width="220" height="280" rx="16" fill="#09090b" stroke="#f59e0b" stroke-width="1.5" />
        <circle cx="35" cy="40" r="18" fill="#f59e0b" fill-opacity="0.2" />
        <text x="35" y="46" fill="#fbbf24" font-size="14" font-weight="bold" text-anchor="middle">3</text>
        <text x="65" y="45" fill="#ffffff" font-size="16" font-weight="bold">SSH &amp; Rsync</text>
        <rect x="20" y="80" width="180" height="1" fill="#27272a" />
        <text x="20" y="115" fill="#a1a1aa" font-size="13">Túnel Cifrado cPanel:</text>
        <text x="20" y="145" fill="#fbbf24" font-family="monospace" font-size="12">rsync -avz --delete</text>
        <text x="20" y="170" fill="#fbbf24" font-family="monospace" font-size="12">ssh -p 22022 user@</text>
        <text x="20" y="215" fill="#71717a" font-size="12">Transferencia diferencial en milisegundos</text>
      </g>

      <!-- Arrow 3 -> 4 -->
      <g transform="translate(735, 130)">
        <line x1="0" y1="10" x2="20" y2="10" stroke="#f59e0b" stroke-width="2" />
        <polygon points="20,5 28,10 20,15" fill="#f59e0b" />
      </g>

      <!-- Stage 4: Live cPanel & LiteSpeed -->
      <g transform="translate(765, 0)">
        <rect x="0" y="0" width="195" height="280" rx="16" fill="#09090b" stroke="#10b981" stroke-width="1.5" />
        <circle cx="35" cy="40" r="18" fill="#10b981" fill-opacity="0.2" />
        <text x="35" y="46" fill="#34d399" font-size="14" font-weight="bold" text-anchor="middle">4</text>
        <text x="65" y="45" fill="#ffffff" font-size="16" font-weight="bold">Producción</text>
        <rect x="20" y="80" width="155" height="1" fill="#27272a" />
        <text x="20" y="115" fill="#a1a1aa" font-size="13">Despliegue Vivo:</text>
        <text x="20" y="145" fill="#34d399" font-family="monospace" font-size="12">touch tmp/restart</text>
        <text x="20" y="170" fill="#34d399" font-family="monospace" font-size="12">purge LSCache</text>
        <text x="20" y="215" fill="#71717a" font-size="12">Cero caídas y actualización instantánea</text>
      </g>
    </g>

    <!-- Bottom Status Bar -->
    <rect x="40" y="355" width="960" height="36" rx="8" fill="#09090b" />
    <circle cx="65" cy="373" r="6" fill="#10b981" />
    <text x="85" y="378" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">PIPELINE EXITOSO: Despliegue completado en 14 segundos en servidores NVMe</text>
  </g>
</svg>
