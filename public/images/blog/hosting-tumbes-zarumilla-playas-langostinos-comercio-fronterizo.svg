<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="bgTumbes" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#18181b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="orangeTumbes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="cyanTumbes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#09090b" />
  <rect width="1200" height="675" fill="url(#bgTumbes)" />

  <!-- Tropical Beach & Mangrove Geometry -->
  <g stroke="#f97316" stroke-width="1" opacity="0.2">
    <polygon points="120,530 380,310 640,530" fill="none" />
    <polygon points="460,540 740,260 1020,540" fill="none" />
    <polygon points="860,530 1080,330 1250,530" fill="none" />
    <line x1="220" y1="0" x2="220" y2="675" />
    <line x1="620" y1="0" x2="620" y2="675" />
    <line x1="1020" y1="0" x2="1020" y2="675" />
  </g>

  <!-- Header -->
  <g transform="translate(80, 65)">
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#f97316" fill-opacity="0.2" stroke="#fb923c" stroke-width="1" />
    <text x="110" y="21" fill="#fed7aa" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">REGIÓN TUMBES</text>
    <text x="0" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="900">HOSTING TUMBES &amp; ZARUMILLA: PLAYAS, LANGOSTINOS &amp; COMERCIO</text>
    <text x="0" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">Alta Disponibilidad NVMe SSD para Hoteles de Playa en Punta Sal, Acuicultura y Comercio Fronterizo</text>
  </g>

  <!-- Left: Main Feature Card -->
  <g transform="translate(80, 195)">
    <rect x="0" y="0" width="580" height="410" rx="20" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
    
    <g transform="translate(30, 25)">
      <!-- Main Metric -->
      <rect x="0" y="0" width="520" height="115" rx="14" fill="#09090b" stroke="#f97316" stroke-width="1.5" />
      <circle cx="50" cy="57" r="25" fill="#f97316" fill-opacity="0.2" />
      <text x="50" y="65" fill="#fb923c" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">🏖️</text>
      <text x="90" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Hoteles de Playa, Acuicultura y Frontera</text>
      <text x="90" y="66" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Portales turísticos de alta velocidad y correos corporativos para exportación</text>
      <text x="90" y="92" fill="#fb923c" font-family="monospace" font-size="11">LiteSpeed LSCache + HTTP/3 • Reservas instantáneas en Punta Sal y Zorritos</text>
    </g>

    <g transform="translate(30, 160)">
      <!-- Box 1: Langostinos y Acuicultura -->
      <rect x="0" y="0" width="250" height="115" rx="14" fill="#09090b" stroke="#06b6d4" stroke-width="1.5" />
      <text x="20" y="30" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">ACUICULTURA &amp; LANGOSTINOS</text>
      <text x="20" y="58" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Empresas Exportadoras</text>
      <text x="20" y="80" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">Cotizaciones B2B seguras</text>
      <text x="20" y="98" fill="#67e8f9" font-family="monospace" font-size="11">Correos SPF/DKIM/DMARC</text>

      <!-- Box 2: Comercio Fronterizo -->
      <rect x="270" y="0" width="250" height="115" rx="14" fill="#09090b" stroke="#fbbf24" stroke-width="1.5" />
      <text x="290" y="30" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">COMERCIO ZARUMILLA</text>
      <text x="290" y="58" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Importación &amp; Tiendas</text>
      <text x="290" y="80" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">Aguas Verdes y Tumbes</text>
      <text x="290" y="98" fill="#fcd34d" font-family="monospace" font-size="11">WooCommerce + NVMe</text>
    </g>

    <!-- Bottom Stat Bar -->
    <g transform="translate(30, 295)">
      <rect x="0" y="0" width="520" height="90" rx="12" fill="#09090b" stroke="#27272a" stroke-width="1" />
      <text x="25" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Uptime 99.9% y Facturación Electrónica SUNAT</text>
      <text x="25" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Factura oficial en Soles (RUC 10 o 20) y atención 24/7 por WhatsApp en Perú</text>
      <text x="470" y="50" fill="#f97316" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="end">S/ 60<tspan font-size="12" fill="#94a3b8">/año</tspan></text>
    </g>
  </g>

  <!-- Right: Comparison vs Competitors -->
  <g transform="translate(690, 195)">
    <rect x="0" y="0" width="430" height="410" rx="20" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
    
    <text x="30" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Por qué elegirnos en Tumbes</text>
    <text x="30" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Infraestructura rápida para turismo y comercio</text>

    <!-- Row 1 -->
    <g transform="translate(30, 95)">
      <rect x="0" y="0" width="370" height="60" rx="10" fill="#09090b" stroke="#f97316" stroke-width="1" />
      <text x="15" y="24" fill="#fb923c" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">DISCOS DE ALTA VELOCIDAD</text>
      <text x="15" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Unidades NVMe SSD PCIe 4.0</text>
      <text x="355" y="35" fill="#fb923c" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="end">Ultrarrápido</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(30, 170)">
      <rect x="0" y="0" width="370" height="60" rx="10" fill="#09090b" stroke="#06b6d4" stroke-width="1" />
      <text x="15" y="24" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">CORREOS PROFESIONALES</text>
      <text x="15" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">SPF, DKIM y DMARC automáticos</text>
      <text x="355" y="35" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="end">Sin Spam</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(30, 245)">
      <rect x="0" y="0" width="370" height="60" rx="10" fill="#09090b" stroke="#f59e0b" stroke-width="1" />
      <text x="15" y="24" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">PRECIO CLARO Y FIJO</text>
      <text x="15" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Sin incrementos al segundo año</text>
      <text x="355" y="35" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="end">S/ 60 Fijo</text>
    </g>

    <!-- Row 4 -->
    <g transform="translate(30, 320)">
      <rect x="0" y="0" width="370" height="65" rx="10" fill="#09090b" stroke="#22c55e" stroke-width="1" />
      <text x="15" y="24" fill="#4ade80" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">ATENCIÓN EN PERÚ</text>
      <text x="15" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Soporte WhatsApp (+51 975 521 788)</text>
      <text x="355" y="35" fill="#22c55e" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="end">24/7 Activo</text>
    </g>
  </g>
</svg>
