    <rect x="0" y="65" width="600" height="50" rx="10" fill="#09090b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="25" y="97" fill="#60a5fa" font-family="sans-serif" font-size="15" font-weight="bold">✓ 2. Multi-Lenguaje (NodeJS + Python + PHP 8)</text>
    <text x="560" y="97" fill="#a1a1aa" font-family="monospace" font-size="13" text-anchor="end">Versiones Selector</text>

    <rect x="0" y="130" width="600" height="50" rx="10" fill="#09090b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="25" y="162" fill="#fbbf24" font-family="sans-serif" font-size="15" font-weight="bold">✓ 3. LiteSpeed Web Server + CloudLinux</text>
    <text x="560" y="162" fill="#a1a1aa" font-family="monospace" font-size="13" text-anchor="end">Aislamiento Seguro</text>

    <rect x="0" y="195" width="600" height="50" rx="10" fill="#09090b" stroke="#10b981" stroke-width="1.5" />
    <text x="25" y="227" fill="#34d399" font-family="sans-serif" font-size="15" font-weight="bold">✓ 4. Soporte Local 24/7 y Precios en Soles</text>
    <text x="560" y="227" fill="#a1a1aa" font-family="monospace" font-size="13" text-anchor="end">Desde S/ 60/año</text>
  </g>

  <!-- Badges -->
