<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="bgSunat" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#18181b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="amberSunat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="purpleSunat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#09090b" />
  <rect width="1200" height="675" fill="url(#bgSunat)" />

  <!-- Background XML & API Flow Grid -->
  <g stroke="#f59e0b" stroke-width="1" opacity="0.15">
    <line x1="120" y1="0" x2="120" y2="675" />
    <line x1="360" y1="0" x2="360" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="840" y1="0" x2="840" y2="675" />
    <line x1="1080" y1="0" x2="1080" y2="675" />
  </g>

  <!-- Header -->
  <g transform="translate(80, 65)">
    <rect x="0" y="0" width="240" height="32" rx="16" fill="#f59e0b" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1" />
    <text x="120" y="21" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">DESARROLLO WEB &amp; SUNAT</text>
    <text x="0" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="900">FACTURACIÓN ELECTRÓNICA SUNAT CON PHP 8.x</text>
    <text x="0" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">Guía de Despliegue en cPanel: Firma Digital XML (.pfx), OpenSSL, SOAP y Conexión OSE/SUNAT</text>
  </g>

  <!-- Left: Architecture Flow Card -->
  <g transform="translate(80, 195)">
    <rect x="0" y="0" width="560" height="410" rx="20" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
    
    <text x="30" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Flujo de Emisión de Comprobantes</text>
    <text x="30" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Facturas, Boletas, Notas de Crédito y Guías de Remisión</text>

    <!-- 3 Steps -->
    <g transform="translate(30, 95)">
      <!-- Step 1 -->
      <rect x="0" y="0" width="500" height="80" rx="12" fill="#09090b" stroke="#f59e0b" stroke-width="1" />
      <circle cx="35" cy="40" r="18" fill="#f59e0b" fill-opacity="0.2" />
      <text x="35" y="46" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1</text>
      <text x="70" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Generación y Firma Digital del XML UBL 2.1</text>
      <text x="70" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Certificado digital .pfx / .pem validado con extensiones OpenSSL y DOM XML</text>
    </g>

    <g transform="translate(30, 190)">
      <!-- Step 2 -->
      <rect x="0" y="0" width="500" height="80" rx="12" fill="#09090b" stroke="#3b82f6" stroke-width="1" />
      <circle cx="35" cy="40" r="18" fill="#3b82f6" fill-opacity="0.2" />
      <text x="35" y="46" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">2</text>
      <text x="70" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Empaquetado ZIP y Envío Web Service SOAP</text>
      <text x="70" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Conexión directa a servidores SUNAT / OSE con timeouts optimizados</text>
    </g>

    <g transform="translate(30, 285)">
      <!-- Step 3 -->
      <rect x="0" y="0" width="500" height="80" rx="12" fill="#09090b" stroke="#22c55e" stroke-width="1" />
      <circle cx="35" cy="40" r="18" fill="#22c55e" fill-opacity="0.2" />
      <text x="35" y="46" fill="#4ade80" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">3</text>
      <text x="70" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Procesamiento y Almacenamiento del CDR</text>
      <text x="70" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Constancia de recepción (CDR) guardada al instante en disco NVMe</text>
    </g>
  </g>

  <!-- Right: Technical Requirements Card -->
  <g transform="translate(670, 195)">
    <rect x="0" y="0" width="450" height="410" rx="20" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
    
    <text x="30" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Extensiones PHP Habilitadas</text>
    <text x="30" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Configuración activa en Brayan Developer Hosting</text>

    <!-- Code box preview -->
    <g transform="translate(30, 95)">
      <rect x="0" y="0" width="390" height="230" rx="12" fill="#09090b" stroke="#27272a" stroke-width="1" />
      <text x="20" y="30" fill="#fbbf24" font-family="monospace" font-size="13"># Extensiones cPanel Activas</text>
      <text x="20" y="60" fill="#34d399" font-family="monospace" font-size="12">✓ extension=openssl</text>
      <text x="20" y="85" fill="#34d399" font-family="monospace" font-size="12">✓ extension=soap</text>
      <text x="20" y="110" fill="#34d399" font-family="monospace" font-size="12">✓ extension=zip</text>
      <text x="20" y="135" fill="#34d399" font-family="monospace" font-size="12">✓ extension=dom &amp; xmlwriter</text>
      <text x="20" y="160" fill="#34d399" font-family="monospace" font-size="12">✓ extension=curl (TLS 1.3)</text>
      <text x="20" y="195" fill="#38bdf8" font-family="monospace" font-size="12">memory_limit = 512M</text>
      <text x="20" y="215" fill="#38bdf8" font-family="monospace" font-size="12">max_execution_time = 300</text>
    </g>

    <!-- Support footer -->
    <g transform="translate(30, 340)">
      <rect x="0" y="0" width="390" height="45" rx="8" fill="#09090b" stroke="#f59e0b" stroke-width="1" />
      <text x="15" y="28" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Soporte Técnico en Perú vía WhatsApp 24/7</text>
    </g>
  </g>
</svg>
