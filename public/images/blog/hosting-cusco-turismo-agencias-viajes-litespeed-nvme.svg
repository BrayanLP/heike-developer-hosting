<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="bgCusco" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#18181b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="goldGradCusco" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#09090b" />
  <rect width="1200" height="675" fill="url(#bgCusco)" />

  <!-- Inca Geometry Pattern in Background -->
  <g stroke="#f59e0b" stroke-width="1" opacity="0.15">
    <polygon points="600,100 650,150 600,200 550,150" fill="none" />
    <polygon points="600,70 680,150 600,230 520,150" fill="none" />
    <polygon points="600,40 710,150 600,260 490,150" fill="none" />
  </g>

  <!-- Header -->
  <g transform="translate(80, 70)">
    <rect x="0" y="0" width="200" height="32" rx="16" fill="#f59e0b" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1" />
    <text x="100" y="21" fill="#fcd34d" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">CAPITAL HISTÓRICA</text>
    <text x="0" y="70" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="900">HOSTING CUSCO: TURISMO &amp; VIAJES</text>
    <text x="0" y="98" fill="#94a3b8" font-family="sans-serif" font-size="15">Velocidad Global LiteSpeed para Agencias de Tours, Hoteles y Portales Multilingües</text>
  </g>

  <!-- Left: Booking Engine &amp; Global Speed Metric Card -->
  <g transform="translate(80, 200)">
    <rect x="0" y="0" width="580" height="400" rx="20" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
    
    <g transform="translate(30, 30)">
      <!-- Global Speed Card -->
      <rect x="0" y="0" width="520" height="110" rx="14" fill="#09090b" stroke="#f59e0b" stroke-width="1.5" />
      <circle cx="50" cy="55" r="25" fill="#f59e0b" fill-opacity="0.2" />
      <text x="50" y="62" fill="#fbbf24" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">🌍</text>
      
      <text x="90" y="42" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Carga Instantánea para Turistas en Todo el Mundo</text>
      <text x="90" y="66" fill="#a1a1aa" font-family="sans-serif" font-size="13">EE.UU. • Europa • Asia: Respuestas menores a 120ms</text>
      <text x="90" y="90" fill="#fbbf24" font-family="monospace" font-size="11">HTTP/3 + Compresión Brotli + LiteSpeed Cache Integrado</text>
    </g>

    <!-- Tourism Features Grid -->
    <g transform="translate(30, 160)">
      <rect x="0" y="0" width="250" height="120" rx="14" fill="#09090b" stroke="#22c55e" stroke-width="1.5" />
      <text x="20" y="32" fill="#4ade80" font-family="sans-serif" font-size="13" font-weight="bold">MOTORES DE RESERVA</text>
      <text x="20" y="60" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Cero Caídas en Pagos</text>
      <text x="20" y="82" fill="#a1a1aa" font-family="sans-serif" font-size="11">Stripe, Culqi, PayPal, Izipay</text>
      <text x="20" y="102" fill="#4ade80" font-family="monospace" font-size="11">SSL Gratis Ilimitado</text>

      <rect x="270" y="0" width="250" height="120" rx="14" fill="#09090b" stroke="#06b6d4" stroke-width="1.5" />
      <text x="290" y="32" fill="#67e8f9" font-family="sans-serif" font-size="13" font-weight="bold">MULTILENGUAJE WPML</text>
      <text x="290" y="60" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Tráfico Internacional</text>
      <text x="290" y="82" fill="#a1a1aa" font-family="sans-serif" font-size="11">Inglés, Francés, Alemán, Portugués</text>
      <text x="290" y="102" fill="#67e8f9" font-family="monospace" font-size="11">NVMe SSD PCIe 4.0</text>
    </g>

    <!-- Bottom Tags -->
    <g transform="translate(30, 310)">
      <rect x="0" y="0" width="120" height="36" rx="8" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1" />
      <text x="60" y="22" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">VALLE SAGRADO</text>

      <rect x="130" y="0" width="120" height="36" rx="8" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1" />
      <text x="190" y="22" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">MACHU PICCHU</text>

      <rect x="260" y="0" width="120" height="36" rx="8" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1" />
      <text x="320" y="22" fill="#67e8f9" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">AGENCIAS TOUR</text>

      <rect x="390" y="0" width="130" height="36" rx="8" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-width="1" />
      <text x="455" y="22" fill="#f472b6" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PLANES EN SOLES</text>
    </g>
  </g>

  <!-- Right: Andean Sun &amp; High-Tech Portal Motif -->
  <g transform="translate(700, 200)">
    <rect x="0" y="0" width="420" height="400" rx="20" fill="#18181b" stroke="#f59e0b" stroke-width="2" />
    
    <!-- Stylized Chakana / Solar Tech Compass -->
    <g transform="translate(210, 160)">
      <circle cx="0" cy="0" r="100" fill="#09090b" stroke="#f59e0b" stroke-width="2" />
      <circle cx="0" cy="0" r="70" fill="#09090b" stroke="#fbbf24" stroke-width="1" stroke-dasharray="6,4" />
      
      <!-- Stepped Chakana Silhouette -->
      <path d="M -30 -50 L 30 -50 L 30 -30 L 50 -30 L 50 30 L 30 30 L 30 50 L -30 50 L -30 30 L -50 30 L -50 -30 L -30 -30 Z" fill="url(#goldGradCusco)" />
      
      <circle cx="0" cy="0" r="15" fill="#09090b" />
      <circle cx="0" cy="0" r="6" fill="#fbbf24" />
    </g>

    <!-- Speed Benchmarks Box -->
    <g transform="translate(40, 290)">
      <rect x="0" y="0" width="340" height="75" rx="12" fill="#09090b" stroke="#3f3f46" stroke-width="1" />
      <text x="20" y="28" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Brayan Hosting vs Servidores Tradicionales</text>
      <text x="20" y="52" fill="#22c55e" font-family="monospace" font-size="12">● Brayan Hosting: 0.6s Carga Total</text>
      <text x="20" y="68" fill="#ef4444" font-family="monospace" font-size="12">○ GoDaddy/HostGator: 3.4s Carga</text>
    </g>
  </g>
</svg>
