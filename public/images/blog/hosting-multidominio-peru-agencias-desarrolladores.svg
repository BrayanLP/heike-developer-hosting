        <rect x="18" y="18" width="130" height="24" rx="6" fill="#10b981" fill-opacity="0.2" />
        <text x="83" y="34" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">CLIENTE 2 (CORPORATIVO)</text>
        <text x="18" y="70" fill="#ffffff" font-size="16" font-weight="bold">estudiocontable.com</text>
        <text x="18" y="90" fill="#a1a1aa" font-size="12">Directorio: /public_html/estudio/</text>
        <rect x="18" y="105" width="269" height="1" fill="#27272a" />
        <text x="18" y="130" fill="#34d399" font-size="12">✓ WordPress Corporativo + Elementor</text>
        <text x="18" y="152" fill="#34d399" font-size="12">✓ SSL TLS 1.3 Dedicado</text>
        <text x="18" y="174" fill="#34d399" font-size="12">✓ Correos SPF/DKIM para Facturación</text>
        <text x="18" y="202" fill="#fbbf24" font-size="12" font-weight="bold">Costo del hosting: S/ 0 adicional</text>
      </g>

