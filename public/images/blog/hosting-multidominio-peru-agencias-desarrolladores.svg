    <text x="65" y="61" fill="#c084fc" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">★</text>
    <text x="95" y="50" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Cuenta Principal NVMe (Plan Pro / Business / Enterprise)</text>
