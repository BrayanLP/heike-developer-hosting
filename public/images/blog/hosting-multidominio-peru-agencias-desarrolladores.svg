        <rect x="0" y="0" width="305" height="230" rx="14" fill="#09090b" stroke="#27272a" stroke-width="1.5" />
        <rect x="18" y="18" width="130" height="24" rx="6" fill="#f59e0b" fill-opacity="0.2" />
        <text x="83" y="34" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="middle">CLIENTE 3 (APP / API)</text>
        <text x="18" y="70" fill="#ffffff" font-size="16" font-weight="bold">api.logistica.pe</text>
        <text x="18" y="90" fill="#a1a1aa" font-size="12">Directorio: /nodeapps/logistica/</text>
        <rect x="18" y="105" width="269" height="1" fill="#27272a" />
