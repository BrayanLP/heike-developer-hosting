    <text x="520" y="381" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">BENEFICIO PARA AGENCIAS: Facturas S/ 300 - S/ 600/año a cada cliente y tu costo anual de servidor es fijo desde S/ 120/año</text>
