        <rect x="18" y="105" width="269" height="1" fill="#27272a" />
        <text x="18" y="130" fill="#34d399" font-size="12">✓ WooCommerce + LiteSpeed Cache</text>
        <text x="18" y="152" fill="#34d399" font-size="12">✓ SSL Let's Encrypt Gratis</text>
        <text x="18" y="174" fill="#34d399" font-size="12">✓ Correos: ventas@tiendavirtual.pe</text>
        <text x="18" y="202" fill="#fbbf24" font-size="12" font-weight="bold">Costo del hosting: S/ 0 adicional</text>
      </g>

