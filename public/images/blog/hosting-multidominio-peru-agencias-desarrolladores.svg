<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="bgMulti" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="55%" stop-color="#18181b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="#09090b" />
  <rect width="1200" height="675" fill="url(#bgMulti)" />

  <!-- Multi-node network grid -->
  <g stroke="#8b5cf6" stroke-width="1" opacity="0.15">
    <circle cx="200" cy="200" r="80" fill="none" />
    <circle cx="1000" cy="200" r="80" fill="none" />
    <circle cx="600" cy="500" r="100" fill="none" />
    <line x1="200" y1="200" x2="600" y2="500" />
    <line x1="1000" y1="200" x2="600" y2="500" />
  </g>

  <!-- Header Badge & Title -->
  <g transform="translate(80, 55)">
    <rect x="0" y="0" width="290" height="32" rx="16" fill="#8b5cf6" fill-opacity="0.2" stroke="#a855f7" stroke-width="1" />
    <text x="145" y="21" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">SOLUCIONES PARA AGENCIAS Y FREELANCERS</text>
    <text x="0" y="70" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="900">HOSTING MULTIDOMINIO EN PERÚ</text>
    <text x="0" y="98" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="15">Cómo Hospedar Múltiples Clientes y Proyectos en una Sola Cuenta NVMe sin Pagar de Más</text>
  </g>

  <!-- Content Layout: Central Multi-Domain Architecture -->
  <g transform="translate(80, 185)">
