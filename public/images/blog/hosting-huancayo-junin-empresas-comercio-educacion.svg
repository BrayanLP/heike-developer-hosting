      <text x="170" y="115" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">HOSTING</text>
      
      <circle cx="70" cy="220" r="28" fill="#09090b" stroke="#3b82f6" stroke-width="1.5" />
      <text x="70" y="225" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SUNAT</text>

      <circle cx="270" cy="220" r="28" fill="#09090b" stroke="#f59e0b" stroke-width="1.5" />
      <text x="270" y="225" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">MOODLE</text>

      <line x1="145" y1="135" x2="90" y2="195" stroke="#10b981" stroke-width="2" stroke-dasharray="4,3" />
      <line x1="195" y1="135" x2="250" y2="195" stroke="#10b981" stroke-width="2" stroke-dasharray="4,3" />

      <rect x="0" y="280" width="340" height="50" rx="10" fill="#09090b" stroke="#334155" stroke-width="1" />
      <text x="170" y="311" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ATENCIÓN EN PERÚ: +51 975 521 788</text>
