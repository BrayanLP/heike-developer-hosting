      <text x="290" y="32" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="bold">EMPRESAS DE TRANSPORTE</text>
      <text x="290" y="60" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Venta de Pasajes Online</text>
