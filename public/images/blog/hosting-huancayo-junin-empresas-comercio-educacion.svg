    <text x="0" y="70" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="900">HOSTING HUANCAYO &amp; VALLE DEL MANTARO</text>
    <text x="0" y="98" fill="#94a3b8" font-family="sans-serif" font-size="15">Infraestructura Robusta para Instituciones Educativas, Comercio Mayorista y Empresas del Centro</text>
  </g>

