      <text x="60" y="22" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">HUANCAYO</text>

      <rect x="130" y="0" width="120" height="36" rx="8" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1" />
      <text x="190" y="22" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">JAUJA / TARMA</text>

      <rect x="260" y="0" width="120" height="36" rx="8" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1" />
      <text x="320" y="22" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">LA MERCED</text>

      <rect x="390" y="0" width="130" height="36" rx="8" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-width="1" />
      <text x="455" y="22" fill="#f472b6" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">DESDE S/ 60/AÑO</text>
