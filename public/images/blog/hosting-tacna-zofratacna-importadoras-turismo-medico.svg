<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="bgTacna" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#18181b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="1" />
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="#09090b" />
  <rect width="1200" height="675" fill="url(#bgTacna)" />

  <!-- Header -->
  <g transform="translate(80, 70)">
    <rect x="0" y="0" width="180" height="32" rx="16" fill="#ef4444" fill-opacity="0.2" stroke="#f87171" stroke-width="1" />
    <text x="90" y="21" fill="#fca5a5" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">CIUDAD HEROICA</text>
    <text x="0" y="70" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="900">HOSTING TACNA &amp; ZOFRATACNA</text>
    <text x="0" y="98" fill="#94a3b8" font-family="sans-serif" font-size="15">Alta Velocidad para Importadoras, Comercio Fronterizo, Clínicas Dentales y Turismo Médico</text>
  </g>

  <!-- Left: Cross-border Trade &amp; Medical Clinic Card -->
  <g transform="translate(80, 200)">
    <rect x="0" y="0" width="580" height="400" rx="20" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
    
    <g transform="translate(30, 30)">
      <!-- Free Zone Feature Box -->
      <rect x="0" y="0" width="520" height="110" rx="14" fill="#09090b" stroke="#ef4444" stroke-width="1.5" />
      <circle cx="50" cy="55" r="25" fill="#ef4444" fill-opacity="0.2" />
      <text x="50" y="62" fill="#f87171" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">🏷️</text>

      <text x="90" y="42" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Catálogos de Importación &amp; ZofraTacna</text>
      <text x="90" y="66" fill="#a1a1aa" font-family="sans-serif" font-size="13">Ventas online hacia Chile, Bolivia y todo el sur del Perú sin interrupciones</text>
      <text x="90" y="90" fill="#f87171" font-family="monospace" font-size="11">LiteSpeed Cache • NVMe PCIe 4.0 • Uptime 99.9%</text>
    </g>

    <!-- Medical &amp; Commercial Features -->
    <g transform="translate(30, 160)">
      <rect x="0" y="0" width="250" height="120" rx="14" fill="#09090b" stroke="#06b6d4" stroke-width="1.5" />
      <text x="20" y="32" fill="#67e8f9" font-family="sans-serif" font-size="13" font-weight="bold">TURISMO MÉDICO &amp; DENTAL</text>
      <text x="20" y="60" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Citas en Línea 24/7</text>
      <text x="20" y="82" fill="#a1a1aa" font-family="sans-serif" font-size="11">Confirmación por WhatsApp</text>
      <text x="20" y="102" fill="#67e8f9" font-family="monospace" font-size="11">SSL Gratis Ilimitado</text>

      <rect x="270" y="0" width="250" height="120" rx="14" fill="#09090b" stroke="#22c55e" stroke-width="1.5" />
      <text x="290" y="32" fill="#4ade80" font-family="sans-serif" font-size="13" font-weight="bold">FACTURACIÓN SUNAT</text>
      <text x="290" y="60" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Emisión sin Retrasos</text>
      <text x="290" y="82" fill="#a1a1aa" font-family="sans-serif" font-size="11">Comprobantes electrónicos B2B</text>
      <text x="290" y="102" fill="#4ade80" font-family="monospace" font-size="11">MySQL / MariaDB Rápido</text>
    </g>

    <!-- Tags -->
    <g transform="translate(30, 310)">
      <rect x="0" y="0" width="115" height="36" rx="8" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1" />
      <text x="57" y="22" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">TACNA CENTRO</text>

      <rect x="125" y="0" width="115" height="36" rx="8" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1" />
      <text x="182" y="22" fill="#67e8f9" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ZOFRATACNA</text>

      <rect x="250" y="0" width="115" height="36" rx="8" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1" />
      <text x="307" y="22" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">TURISMO SALUD</text>

      <rect x="375" y="0" width="115" height="36" rx="8" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1" />
      <text x="432" y="22" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">S/ 60/AÑO</text>
    </g>
  </g>

  <!-- Right: Arch of Tacna &amp; Gateway Illustration -->
  <g transform="translate(700, 200)">
    <rect x="0" y="0" width="420" height="400" rx="20" fill="#18181b" stroke="#ef4444" stroke-width="2" />
    
    <!-- Stylized Parabolic Arch of Tacna -->
    <g transform="translate(60, 40)">
      <path d="M 60 250 Q 150 20 240 250" fill="none" stroke="#ef4444" stroke-width="4" />
      <line x1="60" y1="250" x2="240" y2="250" stroke="#52525b" stroke-width="2" />

      <circle cx="150" cy="110" r="28" fill="#09090b" stroke="#f87171" stroke-width="1.5" />
      <text x="150" y="116" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">🇵🇪</text>

      <rect x="10" y="270" width="280" height="50" rx="10" fill="#09090b" stroke="#22c55e" stroke-width="1.5" />
      <text x="150" y="301" fill="#4ade80" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">SOPORTE 24/7 EN SOLES PERUANOS</text>
    </g>
  </g>
</svg>
