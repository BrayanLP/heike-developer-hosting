<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="bgCallao" cx="80%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#18181b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#082f49" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#09090b" />
  <rect width="1200" height="675" fill="url(#bgCallao)" />

  <!-- Background Maritime Radar Grid -->
  <g stroke="#0369a1" stroke-width="1" opacity="0.3">
    <circle cx="950" cy="330" r="80" fill="none" stroke-dasharray="4,4" />
    <circle cx="950" cy="330" r="160" fill="none" stroke-dasharray="4,4" />
    <circle cx="950" cy="330" r="240" fill="none" />
    <line x1="710" y1="330" x2="1190" y2="330" />
    <line x1="950" y1="90" x2="950" y2="570" />
  </g>

  <!-- Header -->
  <g transform="translate(80, 70)">
    <rect x="0" y="0" width="230" height="32" rx="16" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
    <text x="115" y="21" fill="#7dd3fc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">PROVINCIA CONSTITUCIONAL</text>
    <text x="0" y="70" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="900">HOSTING CALLAO: ADUANAS &amp; LOGÍSTICA</text>
    <text x="0" y="98" fill="#94a3b8" font-family="sans-serif" font-size="15">Infraestructura Crítica 99.99% Uptime para Operadores de Comercio Exterior</text>
  </g>

  <!-- Left: Port &amp; Logistics Operations Dashboard -->
  <g transform="translate(80, 200)">
    <!-- Main Card -->
    <rect x="0" y="0" width="560" height="400" rx="20" fill="#18181b" stroke="#334155" stroke-width="2" />
    
    <g transform="translate(30, 30)">
      <!-- Metric 1: Uptime -->
      <rect x="0" y="0" width="235" height="100" rx="14" fill="#09090b" stroke="#0284c7" stroke-width="1.5" />
      <text x="20" y="32" fill="#7dd3fc" font-family="sans-serif" font-size="12" font-weight="bold">DISPONIBILIDAD CRÍTICA</text>
      <text x="20" y="70" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="900">99.99%</text>
      <text x="140" y="70" fill="#22c55e" font-family="sans-serif" font-size="12" font-weight="bold">UPTIME</text>

      <!-- Metric 2: SUNAT Aduanas API Latency -->
      <rect x="265" y="0" width="235" height="100" rx="14" fill="#09090b" stroke="#22c55e" stroke-width="1.5" />
      <text x="285" y="32" fill="#86efac" font-family="sans-serif" font-size="12" font-weight="bold">API ADUANAS / SUNAT</text>
      <text x="285" y="70" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="900">&lt; 18ms</text>
      <text x="395" y="70" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">LATENCIA</text>
    </g>

    <!-- Cargo Tracking &amp; Port Dispatch Flow -->
    <g transform="translate(30, 155)">
      <rect x="0" y="0" width="500" height="130" rx="14" fill="#09090b" stroke="#1e293b" stroke-width="1.5" />
      <text x="20" y="30" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold">Flujo de Despacho &amp; Notificaciones 24/7</text>
      
      <!-- Stepper -->
      <circle cx="50" cy="75" r="16" fill="#0284c7" />
      <text x="50" y="80" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">DPW</text>
      <line x1="75" y1="75" x2="185" y2="75" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,3" />
      
      <circle cx="210" cy="75" r="16" fill="#0369a1" />
      <text x="210" y="80" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">APM</text>
      <line x1="235" y1="75" x2="345" y2="75" stroke="#0369a1" stroke-width="2" stroke-dasharray="4,3" />

      <circle cx="370" cy="75" r="16" fill="#22c55e" />
      <text x="370" y="80" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SUNAT</text>

      <text x="50" y="110" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Puerto Callao</text>
      <text x="210" y="110" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Terminal Marítimo</text>
      <text x="370" y="110" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Teledespacho</text>
    </g>

    <!-- District Badges -->
    <g transform="translate(30, 310)">
      <rect x="0" y="0" width="115" height="36" rx="8" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1" />
      <text x="57" y="22" fill="#7dd3fc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">CALLAO CENTRO</text>

      <rect x="125" y="0" width="115" height="36" rx="8" fill="#0369a1" fill-opacity="0.2" stroke="#0369a1" stroke-width="1" />
      <text x="182" y="22" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">VENTANILLA</text>

      <rect x="250" y="0" width="115" height="36" rx="8" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="1" />
      <text x="307" y="22" fill="#86efac" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">BELLAVISTA</text>

      <rect x="375" y="0" width="115" height="36" rx="8" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1" />
      <text x="432" y="22" fill="#fcd34d" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">LA PUNTA / PERLA</text>
    </g>
  </g>

  <!-- Right: Stylized Cargo Vessel &amp; Server Stack Illustration -->
  <g transform="translate(680, 200)">
    <!-- Container Ship Vector Silhouette with Glowing Containers -->
    <rect x="0" y="0" width="440" height="400" rx="20" fill="url(#oceanGrad)" stroke="#0284c7" stroke-width="2" />
    
    <!-- Ship Hull -->
    <path d="M 40 280 L 360 280 L 400 230 L 70 230 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    
    <!-- Glowing Server Containers on Deck -->
    <g transform="translate(90, 110)">
      <!-- Tier 1 -->
      <rect x="0" y="60" width="70" height="50" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
      <text x="35" y="90" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">NVMe</text>

      <rect x="80" y="60" width="70" height="50" rx="4" fill="#22c55e" stroke="#4ade80" stroke-width="1.5" />
      <text x="115" y="90" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">SSL 100%</text>

      <rect x="160" y="60" width="70" height="50" rx="4" fill="#f59e0b" stroke="#fbbf24" stroke-width="1.5" />
      <text x="195" y="90" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">BACKUP</text>

      <rect x="240" y="60" width="70" height="50" rx="4" fill="#8b5cf6" stroke="#c084fc" stroke-width="1.5" />
      <text x="275" y="90" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">WAF/DDoS</text>

      <!-- Tier 2 -->
      <rect x="40" y="0" width="70" height="50" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" />
      <text x="75" y="30" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">CORREO</text>

      <rect x="120" y="0" width="70" height="50" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
      <text x="155" y="30" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">SPF/DKIM</text>

      <rect x="200" y="0" width="70" height="50" rx="4" fill="#22c55e" stroke="#4ade80" stroke-width="1.5" />
      <text x="235" y="30" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">cPanel</text>
    </g>

    <!-- Ocean Waves at bottom -->
    <path d="M 0 340 Q 60 320 120 340 T 240 340 T 360 340 T 440 340 L 440 400 L 0 400 Z" fill="#0284c7" fill-opacity="0.3" />
    <path d="M 0 360 Q 60 345 120 360 T 240 360 T 360 360 T 440 360 L 440 400 L 0 400 Z" fill="#0369a1" fill-opacity="0.5" />

    <text x="220" y="385" fill="#e0f2fe" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">PUERTO DEL CALLAO • HUB DIGITAL MARÍTIMO</text>
  </g>
</svg>
