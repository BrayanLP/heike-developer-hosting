<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="bgMoquegua" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#18181b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="skyMoquegua" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="amberMoquegua" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#09090b" />
  <rect width="1200" height="675" fill="url(#bgMoquegua)" />

  <!-- Maritime Port & Mining Valley Grid -->
  <g stroke="#0284c7" stroke-width="1" opacity="0.2">
    <polygon points="100,520 300,320 500,520" fill="none" />
    <polygon points="400,530 650,270 900,530" fill="none" />
    <polygon points="800,520 1000,330 1200,520" fill="none" />
    <line x1="200" y1="0" x2="200" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="1000" y1="0" x2="1000" y2="675" />
  </g>

  <!-- Header -->
  <g transform="translate(80, 65)">
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
    <text x="110" y="21" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">REGIÓN MOQUEGUA</text>
    <text x="0" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="900">HOSTING MOQUEGUA &amp; ILO: MINERÍA, PUERTOS &amp; PESCA</text>
    <text x="0" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">Infraestructura Crítica NVMe SSD para Proveedores Mineros, Operadores Portuarios y Logística</text>
  </g>

  <!-- Left: Main Feature Card -->
  <g transform="translate(80, 195)">
    <rect x="0" y="0" width="580" height="410" rx="20" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
    
    <g transform="translate(30, 25)">
      <!-- Main Metric -->
      <rect x="0" y="0" width="520" height="115" rx="14" fill="#09090b" stroke="#0284c7" stroke-width="1.5" />
      <circle cx="50" cy="57" r="25" fill="#0284c7" fill-opacity="0.2" />
      <text x="50" y="65" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">⚓</text>
      <text x="90" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Sector Minero, Portuario y Logística B2B</text>
      <text x="90" y="66" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Correos institucionales blindados con SPF/DKIM/DMARC para licitaciones</text>
      <text x="90" y="92" fill="#38bdf8" font-family="monospace" font-size="11">CloudLinux OS • Aislamiento total de recursos CPU y RAM</text>
    </g>

    <g transform="translate(30, 160)">
      <!-- Box 1: Gran Minería -->
      <rect x="0" y="0" width="250" height="115" rx="14" fill="#09090b" stroke="#f59e0b" stroke-width="1.5" />
      <text x="20" y="30" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">CONTRATISTAS MINERÍA</text>
      <text x="20" y="58" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Quellaveco &amp; Cuajone</text>
      <text x="20" y="80" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">Cotizaciones seguras 24/7</text>
      <text x="20" y="98" fill="#fbbf24" font-family="monospace" font-size="11">Backups Diarios + SSL</text>

      <!-- Box 2: Puerto de Ilo -->
      <rect x="270" y="0" width="250" height="115" rx="14" fill="#09090b" stroke="#06b6d4" stroke-width="1.5" />
      <text x="290" y="30" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">PUERTO &amp; PESCA ILO</text>
      <text x="290" y="58" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Agencias &amp; Aduanas</text>
      <text x="290" y="80" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">Tracking e intranets rápidas</text>
      <text x="290" y="98" fill="#67e8f9" font-family="monospace" font-size="11">LiteSpeed + NVMe SSD</text>
    </g>

    <!-- Bottom Stat Bar -->
    <g transform="translate(30, 295)">
      <rect x="0" y="0" width="520" height="90" rx="12" fill="#09090b" stroke="#27272a" stroke-width="1" />
      <text x="25" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Disponibilidad 99.9% y Facturación Electrónica SUNAT</text>
      <text x="25" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Factura oficial en Soles (RUC 10 y RUC 20) y soporte WhatsApp en Perú</text>
      <text x="470" y="50" fill="#0284c7" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="end">S/ 60<tspan font-size="12" fill="#94a3b8">/año</tspan></text>
    </g>
  </g>

  <!-- Right: Comparison vs Competitors -->
  <g transform="translate(690, 195)">
    <rect x="0" y="0" width="430" height="410" rx="20" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
    
    <text x="30" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Ventajas para Empresas en Moquegua</text>
    <text x="30" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Rendimiento corporativo y atención técnica directa</text>

    <!-- Row 1 -->
    <g transform="translate(30, 95)">
      <rect x="0" y="0" width="370" height="60" rx="10" fill="#09090b" stroke="#0284c7" stroke-width="1" />
      <text x="15" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">RENDIMIENTO I/O</text>
      <text x="15" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Discos NVMe SSD PCIe 4.0</text>
      <text x="355" y="35" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="end">Ultrarrápido</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(30, 170)">
      <rect x="0" y="0" width="370" height="60" rx="10" fill="#09090b" stroke="#06b6d4" stroke-width="1" />
      <text x="15" y="24" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">COMUNICACIÓN B2B</text>
      <text x="15" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">SPF, DKIM y DMARC 100% activos</text>
      <text x="355" y="35" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="end">Sin Spam</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(30, 245)">
      <rect x="0" y="0" width="370" height="60" rx="10" fill="#09090b" stroke="#f59e0b" stroke-width="1" />
      <text x="15" y="24" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">COSTO TOTAL FIJO</text>
      <text x="15" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Sin cobros sorpresa en renovación</text>
      <text x="355" y="35" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="end">S/ 60 Anual</text>
    </g>

    <!-- Row 4 -->
    <g transform="translate(30, 320)">
      <rect x="0" y="0" width="370" height="65" rx="10" fill="#09090b" stroke="#22c55e" stroke-width="1" />
      <text x="15" y="24" fill="#4ade80" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">MIGRACIÓN INCLUIDA</text>
      <text x="15" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Traslado gratis de web y correos</text>
      <text x="355" y="35" fill="#22c55e" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="end">Sin Caídas</text>
    </g>
  </g>
</svg>
