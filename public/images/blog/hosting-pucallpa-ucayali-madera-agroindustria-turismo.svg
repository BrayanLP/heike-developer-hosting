<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="bgPucallpa" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#18181b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="tealPucallpa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="amberPucallpa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#09090b" />
  <rect width="1200" height="675" fill="url(#bgPucallpa)" />

  <!-- Amazon River & Forest Geometry -->
  <g stroke="#0d9488" stroke-width="1" opacity="0.2">
    <polygon points="120,530 380,300 640,530" fill="none" />
    <polygon points="460,540 740,260 1020,540" fill="none" />
    <polygon points="860,530 1080,330 1250,530" fill="none" />
    <line x1="220" y1="0" x2="220" y2="675" />
    <line x1="620" y1="0" x2="620" y2="675" />
    <line x1="1020" y1="0" x2="1020" y2="675" />
  </g>

  <!-- Header -->
  <g transform="translate(80, 65)">
