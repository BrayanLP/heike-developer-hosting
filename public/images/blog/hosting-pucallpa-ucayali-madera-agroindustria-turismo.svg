      <rect x="0" y="0" width="520" height="115" rx="14" fill="#09090b" stroke="#0d9488" stroke-width="1.5" />
      <circle cx="50" cy="57" r="25" fill="#0d9488" fill-opacity="0.2" />
      <text x="50" y="65" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">🌲</text>
      <text x="90" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Industria Maderera &amp; Agroindustria Amazónica</text>
      <text x="90" y="66" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Portales B2B de exportación y catálogos de madera certificada y palma</text>
      <text x="90" y="92" fill="#2dd4bf" font-family="monospace" font-size="11">CloudLinux + CageFS • Recursos dedicados sin caídas de servidor</text>
    </g>

    <g transform="translate(30, 160)">
