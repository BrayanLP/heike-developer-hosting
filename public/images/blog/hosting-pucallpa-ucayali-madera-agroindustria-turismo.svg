    <text x="110" y="21" fill="#5eead4" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">REGIÓN UCAYALI</text>
    <text x="0" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="900">HOSTING PUCALLPA &amp; UCAYALI: MADERA, AGRO &amp; TURISMO</text>
    <text x="0" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">Alta Velocidad NVMe SSD para la Industria Forestal, Palma Aceitera, Transporte Fluvial y Ecoturismo</text>
  </g>

  <!-- Left: Main Feature Card -->
  <g transform="translate(80, 195)">
    <rect x="0" y="0" width="580" height="410" rx="20" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
    
    <g transform="translate(30, 25)">
