      <rect x="0" y="0" width="250" height="115" rx="14" fill="#09090b" stroke="#fbbf24" stroke-width="1.5" />
      <text x="20" y="30" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">TURISMO AMAZÓNICO</text>
      <text x="20" y="58" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Yarinacocha &amp; Selva</text>
      <text x="20" y="80" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">Reservas rápidas y seguras</text>
      <text x="20" y="98" fill="#fcd34d" font-family="monospace" font-size="11">LiteSpeed + SSL Gratis</text>

      <!-- Box 2: Transporte Fluvial -->
      <rect x="270" y="0" width="250" height="115" rx="14" fill="#09090b" stroke="#06b6d4" stroke-width="1.5" />
      <text x="290" y="30" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">TRANSPORTE FLUVIAL</text>
      <text x="290" y="58" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Logística &amp; Puertos</text>
      <text x="290" y="80" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">Correos SPF/DKIM seguros</text>
      <text x="290" y="98" fill="#67e8f9" font-family="monospace" font-size="11">HTTP/3 + MySQL NVMe</text>
    </g>

