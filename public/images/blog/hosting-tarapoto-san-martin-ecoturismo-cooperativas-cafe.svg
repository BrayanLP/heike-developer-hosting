<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="bgTarapoto" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#18181b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="1" />
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="#09090b" />
  <rect width="1200" height="675" fill="url(#bgTarapoto)" />

  <!-- Header -->
  <g transform="translate(80, 70)">
    <rect x="0" y="0" width="180" height="32" rx="16" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="1" />
    <text x="90" y="21" fill="#6ee7b7" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">SELVA NORORIENTAL</text>
    <text x="0" y="70" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="900">HOSTING TARAPOTO &amp; SAN MARTÍN</text>
    <text x="0" y="98" fill="#94a3b8" font-family="sans-serif" font-size="15">Infraestructura Ultrarrápida para Ecoturismo, Cooperativas de Café/Cacao y Comercio Amazónico</text>
  </g>

  <!-- Left: Eco-lodge &amp; Coffee Export Card -->
  <g transform="translate(80, 200)">
    <rect x="0" y="0" width="580" height="400" rx="20" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
    
    <g transform="translate(30, 30)">
      <!-- Eco-Tourism Box -->
      <rect x="0" y="0" width="520" height="110" rx="14" fill="#09090b" stroke="#10b981" stroke-width="1.5" />
      <circle cx="50" cy="55" r="25" fill="#10b981" fill-opacity="0.2" />
      <text x="50" y="62" fill="#34d399" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">🌿</text>

      <text x="90" y="42" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Reservas para Eco-Lodges, Cascadas y Tours</text>
      <text x="90" y="66" fill="#a1a1aa" font-family="sans-serif" font-size="13">Carga instantánea de galerías fotográficas en alta resolución</text>
      <text x="90" y="90" fill="#34d399" font-family="monospace" font-size="11">Compresión WebP Automática • LiteSpeed LSCache</text>
    </g>

    <!-- Coffee &amp; Cacao Features -->
    <g transform="translate(30, 160)">
      <rect x="0" y="0" width="250" height="120" rx="14" fill="#09090b" stroke="#f59e0b" stroke-width="1.5" />
      <text x="20" y="32" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="bold">COOPERATIVAS DE CAFÉ &amp; CACAO</text>
      <text x="20" y="60" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Comercio Internacional</text>
      <text x="20" y="82" fill="#a1a1aa" font-family="sans-serif" font-size="11">Certificaciones y trazabilidad</text>
      <text x="20" y="102" fill="#fbbf24" font-family="monospace" font-size="11">Correos SPF/DKIM</text>

      <rect x="270" y="0" width="250" height="120" rx="14" fill="#09090b" stroke="#06b6d4" stroke-width="1.5" />
      <text x="290" y="32" fill="#67e8f9" font-family="sans-serif" font-size="13" font-weight="bold">PAGOS FÁCILES EN SOLES</text>
      <text x="290" y="60" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Yape, Plin y Bancos</text>
      <text x="290" y="82" fill="#a1a1aa" font-family="sans-serif" font-size="11">Desde S/ 60/año fijo</text>
      <text x="290" y="102" fill="#67e8f9" font-family="monospace" font-size="11">Activación Inmediata</text>
    </g>

    <!-- Location Badges -->
