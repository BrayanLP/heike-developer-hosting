      <text x="50" y="22" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">TARAPOTO</text>

      <rect x="110" y="0" width="100" height="36" rx="8" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1" />
      <text x="160" y="22" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">MOYOBAMBA</text>

      <rect x="220" y="0" width="100" height="36" rx="8" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1" />
      <text x="270" y="22" fill="#67e8f9" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">LAMAS</text>

      <rect x="330" y="0" width="100" height="36" rx="8" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1" />
      <text x="380" y="22" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">JUANJUÍ</text>

      <rect x="440" y="0" width="80" height="36" rx="8" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-width="1" />
      <text x="480" y="22" fill="#f472b6" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">S/ 60/AÑO</text>
    </g>
  </g>

  <!-- Right: Amazon Canopy &amp; Digital Tech Grid -->
  <g transform="translate(700, 200)">
    <rect x="0" y="0" width="420" height="400" rx="20" fill="#18181b" stroke="#10b981" stroke-width="2" />
    
    <g transform="translate(40, 40)">
      <!-- Leaf &amp; Server Flow -->
      <circle cx="170" cy="100" r="55" fill="#09090b" stroke="#10b981" stroke-width="2" />
      <text x="170" y="112" fill="#34d399" font-family="sans-serif" font-size="32" font-weight="bold" text-anchor="middle">☕</text>

      <rect x="20" y="200" width="300" height="60" rx="12" fill="#09090b" stroke="#334155" stroke-width="1.5" />
      <text x="170" y="228" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Migración Gratuita Asistida</text>
      <text x="170" y="248" fill="#a1a1aa" font-family="sans-serif" font-size="11" text-anchor="middle">Traslado sin cortes ni pérdida de correos</text>

      <rect x="20" y="280" width="300" height="45" rx="10" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="1" />
      <text x="170" y="308" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">WHATSAPP EN PERÚ: 975 521 788</text>
    </g>
