<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="bgGlow7" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#18181b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="cardGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#18181b" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#09090b" />
  <rect width="1200" height="675" fill="url(#bgGlow7)" />

  <rect x="250" y="100" width="700" height="475" rx="24" fill="url(#cardGrad7)" stroke="#3f3f46" stroke-width="2" />
  
  <rect x="250" y="100" width="700" height="50" rx="24" fill="#18181b" />
  <rect x="250" y="125" width="700" height="25" fill="#18181b" />
  <circle cx="285" cy="125" r="7" fill="#ef4444" />
  <circle cx="310" cy="125" r="7" fill="#eab308" />
  <circle cx="335" cy="125" r="7" fill="#22c55e" />
  <text x="600" y="130" fill="#a1a1aa" font-family="monospace" font-size="14" text-anchor="middle">SSL / TLS Certificate Manager &amp; HTTPS Enforcer</text>

  <!-- SSL Padlock and HTTPS Browser Bar -->
  <g transform="translate(300, 180)">
    <!-- Browser URL Bar -->
    <rect x="0" y="0" width="600" height="60" rx="14" fill="#09090b" stroke="#22c55e" stroke-width="2" />
    <g transform="translate(25, 18)">
      <!-- Green Padlock -->
      <rect x="0" y="8" width="18" height="14" rx="3" fill="#22c55e" />
      <path d="M 4 8 L 4 5 Q 4 0 9 0 Q 14 0 14 5 L 14 8" fill="none" stroke="#22c55e" stroke-width="2.5" />
    </g>
    <text x="60" y="36" fill="#22c55e" font-family="sans-serif" font-size="15" font-weight="bold">https://</text>
    <text x="125" y="36" fill="#ffffff" font-family="sans-serif" font-size="15">tudominio.com</text>
    <text x="560" y="36" fill="#22c55e" font-family="monospace" font-size="12" text-anchor="end">TLS 1.3 Active</text>

    <!-- Certificate details box -->
    <rect x="0" y="80" width="600" height="160" rx="14" fill="#09090b" stroke="#27272a" stroke-width="1.5" />
    <text x="25" y="115" fill="#a1a1aa" font-family="sans-serif" font-size="14">Emisor: <tspan fill="#ffffff" font-weight="bold">Let's Encrypt Authority / AutoSSL</tspan></text>
    <text x="25" y="145" fill="#a1a1aa" font-family="sans-serif" font-size="14">Algoritmo de cifrado: <tspan fill="#60a5fa" font-mono="true">ECDSA 384-bit / SHA-256</tspan></text>
    <text x="25" y="175" fill="#a1a1aa" font-family="sans-serif" font-size="14">Renovación: <tspan fill="#22c55e" font-weight="bold">100% Automática sin costo adicional</tspan></text>
    <text x="25" y="205" fill="#a1a1aa" font-family="sans-serif" font-size="14">Compatibilidad: <tspan fill="#fbbf24">Chrome, Safari, iOS, Android, Edge</tspan></text>
  </g>

  <!-- Badges -->
  <g transform="translate(300, 480)">
    <rect x="0" y="0" width="130" height="40" rx="10" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1.5" />
    <text x="65" y="25" fill="#4ade80" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">SSL GRATIS</text>

    <rect x="150" y="0" width="140" height="40" rx="10" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5" />
    <text x="220" y="25" fill="#60a5fa" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">AUTOSSL</text>

    <rect x="310" y="0" width="130" height="40" rx="10" fill="#ff9900" fill-opacity="0.15" stroke="#ff9900" stroke-width="1.5" />
    <text x="375" y="25" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">HTTPS 100%</text>

    <rect x="460" y="0" width="140" height="40" rx="10" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1.5" />
    <text x="530" y="25" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">RENOVACIÓN</text>
  </g>
</svg>
