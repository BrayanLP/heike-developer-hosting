<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="bgPiura" cx="70%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#18181b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="sunWaveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#09090b" />
  <rect width="1200" height="675" fill="url(#bgPiura)" />

  <!-- Header -->
  <g transform="translate(80, 70)">
    <rect x="0" y="0" width="170" height="32" rx="16" fill="#f59e0b" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1" />
    <text x="85" y="21" fill="#fcd34d" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">REGIÓN PIURA</text>
    <text x="0" y="70" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="900">HOSTING PIURA, MÁNCORA &amp; TALARA</text>
    <text x="0" y="98" fill="#94a3b8" font-family="sans-serif" font-size="15">Alta Potencia para Hoteles de Playa, Agroexportadoras y Sector Hidrocarburos</text>
  </g>

  <!-- Left: Beachfront Booking &amp; Agroexport Card -->
  <g transform="translate(80, 200)">
    <rect x="0" y="0" width="580" height="400" rx="20" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
    
    <g transform="translate(30, 30)">
      <!-- Resort Speed Box -->
      <rect x="0" y="0" width="520" height="110" rx="14" fill="#09090b" stroke="#f59e0b" stroke-width="1.5" />
      <circle cx="50" cy="55" r="25" fill="#f59e0b" fill-opacity="0.2" />
      <text x="50" y="62" fill="#fbbf24" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">☀️</text>

      <text x="90" y="42" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Reservas Hoteleras y Pasarelas de Pago Directas</text>
      <text x="90" y="66" fill="#a1a1aa" font-family="sans-serif" font-size="13">Confirmación instantánea de reservas para playas de Máncora y Vichayito</text>
      <text x="90" y="90" fill="#fbbf24" font-family="monospace" font-size="11">LiteSpeed Cache • SSL Let&apos;s Encrypt Ilimitado</text>
    </g>

    <!-- Agro &amp; Energy Features -->
    <g transform="translate(30, 160)">
      <rect x="0" y="0" width="250" height="120" rx="14" fill="#09090b" stroke="#10b981" stroke-width="1.5" />
      <text x="20" y="32" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold">AGROEXPORTACIÓN (MANGO/LIMÓN)</text>
      <text x="20" y="60" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Facturación &amp; Packing</text>
      <text x="20" y="82" fill="#a1a1aa" font-family="sans-serif" font-size="11">APIs SUNAT con TTFB &lt; 150ms</text>
      <text x="20" y="102" fill="#34d399" font-family="monospace" font-size="11">NVMe PCIe 4.0</text>

      <rect x="270" y="0" width="250" height="120" rx="14" fill="#09090b" stroke="#06b6d4" stroke-width="1.5" />
      <text x="290" y="32" fill="#67e8f9" font-family="sans-serif" font-size="13" font-weight="bold">SECTOR TALARA / PESCA</text>
      <text x="290" y="60" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Correos Corporativos</text>
      <text x="290" y="82" fill="#a1a1aa" font-family="sans-serif" font-size="11">100% Entregabilidad SPF/DKIM</text>
      <text x="290" y="102" fill="#67e8f9" font-family="monospace" font-size="11">Sin Caídas en Operaciones</text>
    </g>

    <!-- Location Badges -->
    <g transform="translate(30, 310)">
      <rect x="0" y="0" width="100" height="36" rx="8" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1" />
      <text x="50" y="22" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PIURA</text>

      <rect x="110" y="0" width="100" height="36" rx="8" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1" />
      <text x="160" y="22" fill="#67e8f9" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">MÁNCORA</text>

      <rect x="220" y="0" width="100" height="36" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
      <text x="270" y="22" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SULLANA</text>

      <rect x="330" y="0" width="100" height="36" rx="8" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1" />
      <text x="380" y="22" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">TALARA</text>

      <rect x="440" y="0" width="80" height="36" rx="8" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-width="1" />
      <text x="480" y="22" fill="#f472b6" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">S/ 60/AÑO</text>
    </g>
  </g>

  <!-- Right: Coastal Wave &amp; Sun Graphic -->
  <g transform="translate(700, 200)">
    <rect x="0" y="0" width="420" height="400" rx="20" fill="#18181b" stroke="#f59e0b" stroke-width="2" />
    
    <g transform="translate(40, 40)">
      <!-- Sun and Wave -->
      <circle cx="170" cy="90" r="55" fill="#f59e0b" fill-opacity="0.3" stroke="#fbbf24" stroke-width="2" />
      <path d="M 0 170 Q 80 130 170 170 T 340 170 L 340 240 L 0 240 Z" fill="url(#sunWaveGrad)" />

      <!-- Speed Floating Card -->
      <rect x="20" y="230" width="300" height="50" rx="10" fill="#09090b" stroke="#06b6d4" stroke-width="1.5" />
      <text x="170" y="261" fill="#67e8f9" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">PAGO EN SOLES • YAPE &amp; PLIN</text>

      <rect x="20" y="295" width="300" height="45" rx="10" fill="#f59e0b" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1" />
      <text x="170" y="323" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">WHATSAPP DIRECTO: 975 521 788</text>
    </g>
  </g>
</svg>
