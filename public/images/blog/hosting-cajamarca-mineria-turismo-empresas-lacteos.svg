    <text x="0" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">Alta Disponibilidad 99.9% para Contratistas Mineros, Marcas Lácteas y Turismo Termal</text>
  </g>

  <!-- Left: Main Feature Card -->
