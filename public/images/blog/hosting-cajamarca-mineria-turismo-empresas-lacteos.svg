    <!-- Row 1 -->
    <g transform="translate(30, 95)">
      <rect x="0" y="0" width="370" height="60" rx="10" fill="#09090b" stroke="#10b981" stroke-width="1" />
      <text x="15" y="24" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">VELOCIDAD DE DISCO</text>
      <text x="15" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">NVMe SSD PCIe 4.0</text>
      <text x="355" y="35" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="end">6x más rápido</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(30, 170)">
      <rect x="0" y="0" width="370" height="60" rx="10" fill="#09090b" stroke="#06b6d4" stroke-width="1" />
      <text x="15" y="24" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">CORREO CORPORATIVO</text>
      <text x="15" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">100% Entregabilidad SPF/DKIM</text>
      <text x="355" y="35" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="end">Sin Spam</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(30, 245)">
      <rect x="0" y="0" width="370" height="60" rx="10" fill="#09090b" stroke="#f59e0b" stroke-width="1" />
      <text x="15" y="24" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">TRANSPARENCIA</text>
      <text x="15" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Sin subidas de precio de renovación</text>
      <text x="355" y="35" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="end">Precio Fijo</text>
    </g>

    <!-- Row 4 -->
    <g transform="translate(30, 320)">
      <rect x="0" y="0" width="370" height="65" rx="10" fill="#09090b" stroke="#ec4899" stroke-width="1" />
      <text x="15" y="24" fill="#f472b6" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">ATENCIÓN EN PERÚ</text>
      <text x="15" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">WhatsApp directo (+51 975 521 788)</text>
      <text x="355" y="35" fill="#22c55e" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="end">24/7 Activo</text>
    </g>
