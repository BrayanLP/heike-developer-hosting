      <circle cx="50" cy="57" r="25" fill="#10b981" fill-opacity="0.2" />
      <text x="50" y="65" fill="#34d399" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">⛰️</text>
      <text x="90" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Servicios a la Minería &amp; Portales Corporativos</text>
      <text x="90" y="66" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Correos corporativos SPF/DKIM para licitaciones y cotizaciones sin spam</text>
      <text x="90" y="92" fill="#34d399" font-family="monospace" font-size="11">CloudLinux OS • Aislamiento total de recursos CPU y RAM</text>
    </g>

    <g transform="translate(30, 160)">
