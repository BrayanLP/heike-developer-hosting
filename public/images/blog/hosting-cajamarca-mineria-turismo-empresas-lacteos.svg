      <text x="290" y="30" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">TURISMO HISTÓRICO</text>
      <text x="290" y="58" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Hoteles &amp; Baños del Inca</text>
      <text x="290" y="80" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">Reservas rápidas y seguras</text>
      <text x="290" y="98" fill="#67e8f9" font-family="monospace" font-size="11">LiteSpeed + HTTP/3</text>
    </g>

