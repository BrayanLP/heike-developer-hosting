<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="bgCajamarca" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#18181b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="emeraldCajamarca" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="amberCajamarca" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#09090b" />
  <rect width="1200" height="675" fill="url(#bgCajamarca)" />

  <!-- Mountainous & Digital Circuit Backdrop -->
  <g stroke="#10b981" stroke-width="1" opacity="0.2">
    <polygon points="100,500 300,320 500,500" fill="none" />
    <polygon points="400,520 650,280 900,520" fill="none" />
    <polygon points="800,500 1000,340 1200,500" fill="none" />
    <line x1="200" y1="0" x2="200" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="1000" y1="0" x2="1000" y2="675" />
