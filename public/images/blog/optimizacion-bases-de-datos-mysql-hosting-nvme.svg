<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="bgGlow8" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#18181b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="cardGrad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#18181b" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#09090b" />
  <rect width="1200" height="675" fill="url(#bgGlow8)" />

  <rect x="250" y="100" width="700" height="475" rx="24" fill="url(#cardGrad8)" stroke="#3f3f46" stroke-width="2" />
  
  <rect x="250" y="100" width="700" height="50" rx="24" fill="#18181b" />
  <rect x="250" y="125" width="700" height="25" fill="#18181b" />
  <circle cx="285" cy="125" r="7" fill="#ef4444" />
  <circle cx="310" cy="125" r="7" fill="#eab308" />
  <circle cx="335" cy="125" r="7" fill="#22c55e" />
  <text x="600" y="130" fill="#a1a1aa" font-family="monospace" font-size="14" text-anchor="middle">MySQL &amp; MariaDB Query Engine Optimizer — NVMe IOPS</text>

  <!-- Database Cylinders &amp; SQL Query Visual -->
  <g transform="translate(300, 180)">
    <!-- SQL Terminal Box -->
    <rect x="0" y="0" width="600" height="260" rx="14" fill="#09090b" stroke="#27272a" stroke-width="1.5" />
    <text x="25" y="40" fill="#60a5fa" font-family="monospace" font-size="14" font-weight="bold">mysql&gt; EXPLAIN ANALYZE SELECT * FROM orders WHERE status='paid';</text>
    <text x="25" y="75" fill="#22c55e" font-family="monospace" font-size="13">--&gt; Index Scan using idx_orders_status (cost=0.04..12.50 rows=1500)</text>
    <text x="25" y="110" fill="#ffaa00" font-family="monospace" font-size="14">Execution time: 0.0028s (NVMe High-Speed I/O Cache)</text>
    
    <line x1="25" y1="135" x2="575" y2="135" stroke="#27272a" stroke-width="1" />
    <text x="25" y="165" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">InnoDB Buffer Pool: 100% Hit Rate</text>
    <text x="25" y="195" fill="#a1a1aa" font-family="sans-serif" font-size="13">Slow Query Log: 0 bottlenecks detectados</text>
    <text x="25" y="225" fill="#22c55e" font-family="sans-serif" font-size="13">IOPS Disponibles: Hasta 500,000 IOPS en bus PCIe 4.0</text>
  </g>

  <!-- Badges -->
  <g transform="translate(300, 480)">
    <rect x="0" y="0" width="130" height="40" rx="10" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5" />
    <text x="65" y="25" fill="#60a5fa" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">MYSQL 8.0</text>

    <rect x="150" y="0" width="130" height="40" rx="10" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1.5" />
    <text x="215" y="25" fill="#22d3ee" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">MARIADB</text>

    <rect x="300" y="0" width="140" height="40" rx="10" fill="#ff9900" fill-opacity="0.15" stroke="#ff9900" stroke-width="1.5" />
    <text x="370" y="25" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">500K IOPS</text>

    <rect x="460" y="0" width="140" height="40" rx="10" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5" />
    <text x="530" y="25" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">INDEXING</text>
  </g>
</svg>
