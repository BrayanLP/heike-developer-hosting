<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="bgMadreDeDios" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#16a34a" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#18181b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="greenMadreDeDios" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="amberMadreDeDios" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#09090b" />
  <rect width="1200" height="675" fill="url(#bgMadreDeDios)" />

  <!-- Amazonian Rainforest & River Canopy Geometry -->
  <g stroke="#16a34a" stroke-width="1" opacity="0.2">
    <polygon points="120,530 380,290 640,530" fill="none" />
    <polygon points="460,540 740,250 1020,540" fill="none" />
    <polygon points="860,530 1080,320 1250,530" fill="none" />
    <line x1="240" y1="0" x2="240" y2="675" />
    <line x1="640" y1="0" x2="640" y2="675" />
    <line x1="1040" y1="0" x2="1040" y2="675" />
  </g>

  <!-- Header -->
  <g transform="translate(80, 65)">
