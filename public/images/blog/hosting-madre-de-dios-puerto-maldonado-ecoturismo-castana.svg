  <!-- Right: Comparison vs Competitors -->
  <g transform="translate(690, 195)">
    <rect x="0" y="0" width="430" height="410" rx="20" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
    
    <text x="30" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Por qué elegirnos en Madre de Dios</text>
    <text x="30" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Rendimiento para ecoturismo y comercio</text>

    <!-- Row 1 -->
    <g transform="translate(30, 95)">
