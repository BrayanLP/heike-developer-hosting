      <text x="15" y="24" fill="#4ade80" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">VELOCIDAD NVME SSD</text>
      <text x="15" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Discos PCIe 4.0 hasta 6x más veloces</text>
      <text x="355" y="35" fill="#4ade80" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="end">&gt; 3500 MB/s</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(30, 170)">
      <rect x="0" y="0" width="370" height="60" rx="10" fill="#09090b" stroke="#22c55e" stroke-width="1" />
      <text x="15" y="24" fill="#86efac" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">CORREOS CORPORATIVOS</text>
      <text x="15" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">SPF, DKIM y DMARC automáticos</text>
      <text x="355" y="35" fill="#86efac" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="end">Sin Spam</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(30, 245)">
      <rect x="0" y="0" width="370" height="60" rx="10" fill="#09090b" stroke="#f59e0b" stroke-width="1" />
      <text x="15" y="24" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">PRECIO FIJO ANUAL</text>
      <text x="15" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Sin incrementos al renovar</text>
      <text x="355" y="35" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="end">S/ 60 Fijo</text>
    </g>

    <!-- Row 4 -->
