      <text x="20" y="80" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">Reservas globales en vivo</text>
      <text x="20" y="98" fill="#86efac" font-family="monospace" font-size="11">SSL Gratis Ilimitado</text>

      <!-- Box 2: Castaña Amazónica -->
