    <text x="125" y="21" fill="#bbf7d0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">REGIÓN MADRE DE DIOS</text>
    <text x="0" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="900">HOSTING MADRE DE DIOS: ECOTURISMO EN TAMBOPATA &amp; CASTAÑA</text>
    <text x="0" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">Alta Velocidad NVMe SSD para Ecolodges en Tambopata y Manu, Exportadores de Castaña y Comercio</text>
  </g>

  <!-- Left: Main Feature Card -->
