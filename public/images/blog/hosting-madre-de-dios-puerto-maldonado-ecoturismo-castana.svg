      <rect x="0" y="0" width="520" height="115" rx="14" fill="#09090b" stroke="#16a34a" stroke-width="1.5" />
      <circle cx="50" cy="57" r="25" fill="#16a34a" fill-opacity="0.2" />
      <text x="50" y="65" fill="#4ade80" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">🦜</text>
      <text x="90" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Ecolodges, Tambopata, Manu y Castañas</text>
      <text x="90" y="66" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Portales turísticos para reservas internacionales y correos corporativos seguros</text>
      <text x="90" y="92" fill="#4ade80" font-family="monospace" font-size="11">LiteSpeed Cache + HTTP/3 • Cero caídas en temporada alta</text>
    </g>

    <g transform="translate(30, 160)">
      <!-- Box 1: Ecoturismo y Lodges -->
      <rect x="0" y="0" width="250" height="115" rx="14" fill="#09090b" stroke="#22c55e" stroke-width="1.5" />
      <text x="20" y="30" fill="#86efac" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">TAMBOPATA &amp; MANU</text>
