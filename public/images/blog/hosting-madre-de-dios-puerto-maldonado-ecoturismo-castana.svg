      <text x="290" y="30" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">CASTAÑA AMAZÓNICA</text>
      <text x="290" y="58" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Exportación y Mypes</text>
      <text x="290" y="80" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">Iñapari y Puerto Maldonado</text>
      <text x="290" y="98" fill="#fcd34d" font-family="monospace" font-size="11">WooCommerce + NVMe</text>
