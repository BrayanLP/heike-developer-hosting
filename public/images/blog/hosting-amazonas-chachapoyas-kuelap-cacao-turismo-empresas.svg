<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="bgAmazonas" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#18181b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="skyAmazonas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="amberAmazonas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#09090b" />
  <rect width="1200" height="675" fill="url(#bgAmazonas)" />

  <!-- Kuélap & Mountain Waterfall Geometry -->
  <g stroke="#0284c7" stroke-width="1" opacity="0.2">
    <polygon points="120,530 380,270 640,530" fill="none" />
    <polygon points="460,540 740,240 1020,540" fill="none" />
    <polygon points="860,530 1080,310 1250,530" fill="none" />
    <line x1="240" y1="0" x2="240" y2="675" />
    <line x1="640" y1="0" x2="640" y2="675" />
    <line x1="1040" y1="0" x2="1040" y2="675" />
  </g>

  <!-- Header -->
  <g transform="translate(80, 65)">
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
    <text x="110" y="21" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">REGIÓN AMAZONAS</text>
    <text x="0" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="900">HOSTING AMAZONAS: CHACHAPOYAS, KUÉLAP &amp; CACAO FINO</text>
    <text x="0" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">Alta Velocidad NVMe SSD para Turismo en Kuélap y Gocta, Productores de Cacao y Hoteles</text>
  </g>

  <!-- Left: Main Feature Card -->
  <g transform="translate(80, 195)">
    <rect x="0" y="0" width="580" height="410" rx="20" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
    
    <g transform="translate(30, 25)">
      <!-- Main Metric -->
      <rect x="0" y="0" width="520" height="115" rx="14" fill="#09090b" stroke="#0284c7" stroke-width="1.5" />
      <circle cx="50" cy="57" r="25" fill="#0284c7" fill-opacity="0.2" />
      <text x="50" y="65" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">🏛️</text>
      <text x="90" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Turismo en Kuélap &amp; Gocta, Cacao y Café</text>
      <text x="90" y="66" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Portales web con reservas en vivo y tiendas virtuales para mercados globales</text>
      <text x="90" y="92" fill="#38bdf8" font-family="monospace" font-size="11">LiteSpeed LSCache + HTTP/3 • Carga instantánea de tours y fotos</text>
    </g>

    <g transform="translate(30, 160)">
      <!-- Box 1: Turismo y Hoteles -->
      <rect x="0" y="0" width="250" height="115" rx="14" fill="#09090b" stroke="#0ea5e9" stroke-width="1.5" />
      <text x="20" y="30" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">KUÉLAP &amp; GOCTA</text>
      <text x="20" y="58" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Hoteles &amp; Agencias</text>
      <text x="20" y="80" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">Reservas sin caídas</text>
      <text x="20" y="98" fill="#7dd3fc" font-family="monospace" font-size="11">SSL Gratis Ilimitado</text>

      <!-- Box 2: Cacao y Café Fino -->
      <rect x="270" y="0" width="250" height="115" rx="14" fill="#09090b" stroke="#f59e0b" stroke-width="1.5" />
      <text x="290" y="30" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">BAGUA &amp; MENDOZA</text>
      <text x="290" y="58" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Cacao y Café Fino</text>
      <text x="290" y="80" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">Tiendas de exportación</text>
      <text x="290" y="98" fill="#fcd34d" font-family="monospace" font-size="11">WooCommerce + NVMe</text>
    </g>

    <!-- Bottom Stat Bar -->
    <g transform="translate(30, 295)">
      <rect x="0" y="0" width="520" height="90" rx="12" fill="#09090b" stroke="#27272a" stroke-width="1" />
      <text x="25" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Uptime 99.9% y Facturación Electrónica SUNAT</text>
      <text x="25" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Facturación oficial en Soles con atención personalizada por WhatsApp</text>
      <text x="470" y="50" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="end">S/ 60<tspan font-size="12" fill="#94a3b8">/año</tspan></text>
    </g>
  </g>

  <!-- Right: Comparison vs Competitors -->
  <g transform="translate(690, 195)">
    <rect x="0" y="0" width="430" height="410" rx="20" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
    
    <text x="30" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Por qué elegirnos en Amazonas</text>
    <text x="30" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Velocidad para turismo y productos orgánicos</text>

    <!-- Row 1 -->
    <g transform="translate(30, 95)">
      <rect x="0" y="0" width="370" height="60" rx="10" fill="#09090b" stroke="#0284c7" stroke-width="1" />
      <text x="15" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">DISCOS NVME SSD</text>
      <text x="15" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">PCIe 4.0 hasta 6x más veloces</text>
      <text x="355" y="35" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="end">&gt; 3500 MB/s</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(30, 170)">
      <rect x="0" y="0" width="370" height="60" rx="10" fill="#09090b" stroke="#0ea5e9" stroke-width="1" />
      <text x="15" y="24" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">CORREOS CORPORATIVOS</text>
      <text x="15" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">SPF, DKIM y DMARC automáticos</text>
      <text x="355" y="35" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="end">Cero Spam</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(30, 245)">
      <rect x="0" y="0" width="370" height="60" rx="10" fill="#09090b" stroke="#f59e0b" stroke-width="1" />
      <text x="15" y="24" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">PRECIO FIJO TRANSPARENTE</text>
      <text x="15" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Sin subidas de renovación</text>
      <text x="355" y="35" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="end">S/ 60 Fijo</text>
    </g>

    <!-- Row 4 -->
    <g transform="translate(30, 320)">
      <rect x="0" y="0" width="370" height="65" rx="10" fill="#09090b" stroke="#22c55e" stroke-width="1" />
      <text x="15" y="24" fill="#4ade80" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">ATENCIÓN EN PERÚ</text>
      <text x="15" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Soporte WhatsApp (+51 975 521 788)</text>
      <text x="355" y="35" fill="#4ade80" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="end">24/7 Activo</text>
    </g>
  </g>
</svg>
