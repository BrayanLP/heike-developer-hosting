<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="acc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7d83fd" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7d83fd" stop-opacity="0.2" />
    </linearGradient>
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bg)" />

  <!-- Ambient Glow -->
  <circle cx="1050" cy="150" r="220" fill="#7d83fd" opacity="0.15" filter="url(#blurGlow)" />
  <circle cx="150" cy="520" r="260" fill="#7d83fd" opacity="0.1" filter="url(#blurGlow)" />

  <!-- Grid Pattern -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.04">
    <line x1="120" y1="0" x2="120" y2="675" />
    <line x1="240" y1="0" x2="240" y2="675" />
    <line x1="360" y1="0" x2="360" y2="675" />
    <line x1="480" y1="0" x2="480" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="720" y1="0" x2="720" y2="675" />
    <line x1="840" y1="0" x2="840" y2="675" />
    <line x1="960" y1="0" x2="960" y2="675" />
    <line x1="1080" y1="0" x2="1080" y2="675" />
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
  </g>

  <!-- Accent Top Border -->
  <rect x="0" y="0" width="1200" height="6" fill="#7d83fd" />

  <!-- Category Tag -->
  <g transform="translate(100, 110)">
    <rect x="0" y="0" width="223" height="36" rx="18" fill="#7d83fd" fill-opacity="0.15" stroke="#7d83fd" stroke-width="1.5" />
    <text x="18" y="23" fill="#7d83fd" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">SOFTWARE A MEDIDA</text>
  </g>

  <!-- Title Text -->
  <text x="100" y="230" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">Desarrollo de Software a Medida en Perú: Cuándo</text>
  <text x="100" y="295" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">Elegir un Desarrollo Propio vs Comprar un SaaS</text>

  <!-- Decorative Line -->
  <rect x="100" y="340" width="80" height="4" rx="2" fill="#7d83fd" />

  <!-- Bottom Brand Footprint -->
  <text x="100" y="580" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" letter-spacing="0.5">ARTÍCULO EDITORIAL • ACTUALIZADO 2026-09-04</text>
  <circle cx="1080" cy="575" r="8" fill="#7d83fd" />
  <circle cx="1105" cy="575" r="4" fill="#7d83fd" opacity="0.5" />
</svg>