<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="bgGlow4" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#18181b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#18181b" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#09090b" />
  <rect width="1200" height="675" fill="url(#bgGlow4)" />

  <rect x="250" y="100" width="700" height="475" rx="24" fill="url(#cardGrad4)" stroke="#3f3f46" stroke-width="2" />
  
  <rect x="250" y="100" width="700" height="50" rx="24" fill="#18181b" />
  <rect x="250" y="125" width="700" height="25" fill="#18181b" />
  <circle cx="285" cy="125" r="7" fill="#ef4444" />
  <circle cx="310" cy="125" r="7" fill="#eab308" />
  <circle cx="335" cy="125" r="7" fill="#22c55e" />
  <text x="600" y="130" fill="#a1a1aa" font-family="monospace" font-size="14" text-anchor="middle">Zero-Downtime Website Migration Process</text>

  <!-- Migration Visual (Server A -> Transfer -> Server B) -->
  <g transform="translate(300, 180)">
    <!-- Origin Server -->
    <rect x="0" y="20" width="160" height="180" rx="12" fill="#09090b" stroke="#3f3f46" stroke-width="1.5" />
    <text x="80" y="60" fill="#a1a1aa" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Hosting Anterior</text>
    <text x="80" y="90" fill="#71717a" font-family="sans-serif" font-size="11" text-anchor="middle">SATA SSD / Lento</text>
    <rect x="25" y="120" width="110" height="12" rx="4" fill="#ef4444" opacity="0.7" />
    <rect x="25" y="140" width="80" height="12" rx="4" fill="#71717a" opacity="0.5" />

    <!-- Arrow / Data flow -->
    <g transform="translate(190, 90)">
      <path d="M 0 20 L 190 20 M 170 5 L 190 20 L 170 35" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <text x="95" y="0" fill="#10b981" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">MIGRACIÓN 100% GRATIS</text>
      <text x="95" y="45" fill="#a1a1aa" font-family="sans-serif" font-size="11" text-anchor="middle">0% Downtime • DB Sync</text>
    </g>

    <!-- Destination Server -->
    <rect x="420" y="20" width="180" height="180" rx="12" fill="#09090b" stroke="#10b981" stroke-width="2" />
    <text x="510" y="60" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Brayan Developer</text>
    <text x="510" y="85" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">NVMe + LiteSpeed</text>
    <rect x="445" y="120" width="130" height="12" rx="4" fill="#10b981" />
    <rect x="445" y="140" width="110" height="12" rx="4" fill="#ff9900" />
    <rect x="445" y="160" width="90" height="12" rx="4" fill="#3b82f6" />
  </g>

  <!-- Badges -->
  <g transform="translate(300, 480)">
    <rect x="0" y="0" width="140" height="40" rx="10" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5" />
    <text x="70" y="25" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">SIN CAÍDAS</text>

    <rect x="160" y="0" width="140" height="40" rx="10" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5" />
    <text x="230" y="25" fill="#60a5fa" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">DB + CORREOS</text>

    <rect x="320" y="0" width="130" height="40" rx="10" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5" />
    <text x="385" y="25" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">SSL GRATIS</text>

    <rect x="470" y="0" width="130" height="40" rx="10" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1.5" />
    <text x="535" y="25" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">SOPORTE 24/7</text>
  </g>
</svg>
